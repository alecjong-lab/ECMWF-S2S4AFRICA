name: Test ws_scripts slide plots

on:
  workflow_dispatch:

jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install python-pptx
        run: pip install python-pptx

      - name: Compute DATE_STR
        id: date
        run: echo "date=$(date -u -d '2 days ago' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run slide7.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide7.sh

      - name: Run slide8.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide8.sh

      - name: Run slide9.sh
        continue-on-error: true
        working-directory: ws_scripts
        env:
          TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
          TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
        run: bash slide9.sh

      - name: Run slide10.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide10.sh

      - name: Run slide11.sh
        continue-on-error: true
        working-directory: ws_scripts
        env:
          ECMWF_DATASTORES_URL: "https://ecds.ecmwf.int/api"
          ECMWF_DATASTORES_KEY: ${{ secrets.CDSAPI_KEY }}
        run: bash slide11.sh

      - name: Run slide12.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide12.sh

      - name: Run slide13.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide13.sh

      - name: Run slide14.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide14.sh

      - name: Run slide15.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide15.sh

      - name: Run slide171819.sh
        continue-on-error: true
        working-directory: ws_scripts
        run: bash slide171819.sh

      - name: Collect briefing plots
        run: |
          mkdir -p "plots/${{ steps.date.outputs.date }}/briefing_plots"
          mv ws_scripts/*.png "plots/${{ steps.date.outputs.date }}/briefing_plots/" 2>/dev/null || true

      - name: Build briefing3 pptx
        continue-on-error: true
        env:
          DATE_STR: ${{ steps.date.outputs.date }}
          MAIN_PATH: ${{ github.workspace }}
        run: python populate_briefing_template3.py

      - name: Upload briefing plots
        uses: actions/upload-artifact@v4
        with:
          name: briefing-plots
          path: plots/${{ steps.date.outputs.date }}/briefing_plots/*.png

      - name: Upload briefing pptx
        uses: actions/upload-artifact@v4
        with:
          name: briefing-pptx
          path: s2s_briefing3_*.pptx
