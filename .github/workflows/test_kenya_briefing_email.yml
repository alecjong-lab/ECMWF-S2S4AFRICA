# Manual dry-run of the Kenya briefing email/Drive path.
# Skips ECMWF/GEFS downloads: reuses plots already on GCS for DATE_STR.
# Bakes the live Drive Kenya template (weather_briefing_kenya_template) via
# ai_weather_briefing.py. The pptx is uploaded to a TEST subfolder of the
# Kenya briefing Drive folder (not the live deck). The email attaches every
# PNG present after the pull (not the pptx — Resend caps at 10 MB).
name: Test Kenya briefing email

on:
  workflow_dispatch:
    inputs:
      date_str:
        description: "Briefing date YYYY-MM-DD (blank = today). Original ECMWF plots are pulled from 2 days earlier."
        required: false
        default: ""
      to_email:
        description: "Only recipient for this test"
        required: false
        default: "genevieve@rhizaresearch.org"

permissions:
  contents: read
  id-token: write

jobs:
  briefing-email:
    runs-on: ubuntu-latest
    env:
      BUCKET: africa-forecasting-data
      TEST_EMAIL: ${{ inputs.to_email || 'genevieve@rhizaresearch.org' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve forecast date
        id: date
        run: |
          if [ -n "${{ inputs.date_str }}" ]; then
            date="${{ inputs.date_str }}"
          else
            date="$(date -u +%Y-%m-%d)"
          fi
          ecmwf="$(date -u -d "$date - 2 days" +%Y-%m-%d)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "ecmwf_date=$ecmwf" >> "$GITHUB_OUTPUT"
          echo "Using DATE_STR=$date ECMWF_DATE_STR=$ecmwf, emailing $TEST_EMAIL"

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull existing plots from GCS
        continue-on-error: true
        run: |
          date="${{ steps.date.outputs.date }}"
          ecmwf="${{ steps.date.outputs.ecmwf_date }}"
          for rel in \
            "plots/Kenya/${ecmwf}" \
            "plots/Great_Horn/${ecmwf}" \
            "plots/diagnostics/${ecmwf}" \
            "plots/briefing/${date}" \
            "plots/briefing/${ecmwf}"
          do
            mkdir -p "$rel"
            gcloud storage rsync -r "gs://${BUCKET}/${rel}" "$rel" || true
          done
          echo "Pulled plot dirs:"
          find plots -type f -name '*.png' | head -50

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Generate AI weather briefing
        continue-on-error: true
        env:
          MAIN_PATH: ${{ github.workspace }}/
          DATE_STR: ${{ steps.date.outputs.date }}
          ECMWF_DATE_STR: ${{ steps.date.outputs.ecmwf_date }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRIEFING_TEMPLATE_ID: "1zSp3C35PqDfMKbT8WtEcxoG2EoyIAJA5"
          BRIEFING_ALLOW_MISSING_PICTURES: "1"
        run: python ai_weather_briefing.py

      - name: Upload briefing plots
        uses: actions/upload-artifact@v4
        with:
          name: briefing-plots
          path: plots/briefing/${{ steps.date.outputs.date }}/*.png
          if-no-files-found: warn

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-s2s-briefing
          path: s2s_briefing_${{ steps.date.outputs.date }}.pptx
          if-no-files-found: warn

      - name: Build attachment list
        id: attachments
        run: |
          set -euo pipefail
          MAX_BYTES=9500000
          mapfile -t files < <(
            {
              find plots/briefing -type f -name '*.png' 2>/dev/null
              find plots -type f -name '*.png' 2>/dev/null | grep -v '/plots/briefing/' || true
            } | sort -u
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "note=No PNGs found." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total=0
          for f in "${files[@]}"; do
            total=$((total + $(stat -c%s "$f")))
          done
          echo "Found ${#files[@]} PNGs totaling ${total} bytes"
          if [ "$total" -le "$MAX_BYTES" ]; then
            list=$(IFS=,; echo "${files[*]}")
            echo "list=$list" >> "$GITHUB_OUTPUT"
            echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
            echo "note=All ${#files[@]} PNGs are attached." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip -q test_run_plots.zip "${files[@]}"
          zip_bytes=$(stat -c%s test_run_plots.zip)
          echo "Zip is ${zip_bytes} bytes"
          if [ "$zip_bytes" -le "$MAX_BYTES" ]; then
            echo "list=test_run_plots.zip" >> "$GITHUB_OUTPUT"
            echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
            echo "note=All ${#files[@]} PNGs packed into a zip (over Resend's 10 MB as individuals)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          packed=()
          packed_bytes=0
          for f in "${files[@]}"; do
            sz=$(stat -c%s "$f")
            if [ $((packed_bytes + sz)) -le "$MAX_BYTES" ]; then
              packed+=("$f")
              packed_bytes=$((packed_bytes + sz))
            fi
          done
          list=$(IFS=,; echo "${packed[*]}")
          skipped=$(( ${#files[@]} - ${#packed[@]} ))
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "count=${#packed[@]}" >> "$GITHUB_OUTPUT"
          echo "note=Attached ${#packed[@]} of ${#files[@]} PNGs (${skipped} omitted — Resend 10 MB cap). Full set is in the run artifacts." >> "$GITHUB_OUTPUT"

      - name: Upload briefing to Drive and share
        if: hashFiles(format('s2s_briefing_{0}.pptx', steps.date.outputs.date)) != ''
        id: drive
        continue-on-error: true
        run: |
          python -u publish_briefing_to_drive.py \
            --file "s2s_briefing_${{ steps.date.outputs.date }}.pptx" \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho" \
            --subfolder TEST \
            --emails "${{ env.TEST_EMAIL }}"

      - name: Find latest manual analysis deck
        continue-on-error: true
        id: manual_deck
        run: |
          python -u find_latest_manual_analysis.py \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho"

      - name: Email test briefing
        if: hashFiles(format('s2s_briefing_{0}.pptx', steps.date.outputs.date)) != ''
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "[TEST] Kenya S2S briefing ${{ steps.date.outputs.date }}"
          to: ${{ env.TEST_EMAIL }}
          from: "Kenya Data Share <info@dashboards.rhizaresearch.org>"
          body: |
            Today's Kenya S2S briefing is a shared Google Slides deck:
            ${{ steps.drive.outputs.drive_url || '(upload failed)' }}
            Please comment on that deck rather than a local copy.
            Latest expert analysis deck:
            ${{ steps.manual_deck.outputs.deck_url || '(none found)' }}
            ${{ steps.attachments.outputs.note || '' }}
            You can browse the full plot archive (except station data) at
            https://console.cloud.google.com/storage/browser/africa-forecasting-data .
          reply_to: genevieve@rhizaresearch.org
          attachments: ${{ steps.attachments.outputs.list }}
