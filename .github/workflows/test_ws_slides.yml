name: Test ws_slides

# Manual dry-run of ws_scripts/*.sh briefing plots, then bake them into the
# live Drive Kenya template (weather_briefing_kenya_template) via
# ai_weather_briefing.py. Only checked scripts run. "Run every plot" is off
# unless you tick it. Missing core ECMWF/GEFS pictures become blank boxes
# (BRIEFING_ALLOW_MISSING_PICTURES) so a skills-only run still produces a pptx.
#
# Never write to the live briefing location: no Drive upload, no GCS
# rsync to gs://africa-forecasting-data/plots/briefing/. Outputs stay in
# the runner and GitHub Actions artifacts.

on:
  workflow_dispatch:
    inputs:
      date_str:
        description: "Briefing date YYYY-MM-DD (blank = today). Skills scripts probe their own latest."
        required: false
        default: ""
      run_all:
        description: "Run every plot (leave unchecked to run only the boxes below)"
        type: boolean
        default: false
      run_recent_rainfall_observations_kenya:
        description: "recent_rainfall_observations_kenya.sh"
        type: boolean
        default: false
      run_recent_rainfall_observations_eastern_africa:
        description: "recent_rainfall_observations_eastern_africa.sh"
        type: boolean
        default: false
      run_recent_observations_station_data:
        description: "recent_observations_station_data.sh"
        type: boolean
        default: false
      run_seasonal_progression:
        description: "seasonal_progression.sh"
        type: boolean
        default: false
      run_seasonal_progression_vs_analog_years:
        description: "seasonal_progression_vs_analog_years.sh"
        type: boolean
        default: false
      run_equatorial_waves_mjo:
        description: "equatorial_waves_mjo.sh"
        type: boolean
        default: false
      run_equatorial_waves_iod_enso:
        description: "equatorial_waves_iod_enso.sh"
        type: boolean
        default: false
      run_itcz_state:
        description: "itcz_state.sh"
        type: boolean
        default: false
      run_equatorial_waves_analyses_and_forecasts:
        description: "equatorial_waves_analyses_and_forecasts.sh"
        type: boolean
        default: false
      run_current_sst_conditions:
        description: "current_sst_conditions.sh"
        type: boolean
        default: false
      run_last_weeks_forecast_verification:
        description: "last_weeks_forecast_verification.sh"
        type: boolean
        default: false
      run_week1_mae_vs_chirps:
        description: "week1_mae_vs_chirps.sh"
        type: boolean
        default: false
      run_kenya_daily_downscaled_precip:
        description: "kenya_daily_downscaled_precip.sh (KMSA / AIFS / GEFS daily maps)"
        type: boolean
        default: false
      run_timeseries_verification:
        description: "timeseries_verification.sh (currently flaky)"
        type: boolean
        default: false

jobs:
  slides:
    runs-on: ubuntu-latest
    env:
      # uvx unpacks forecasting-skills into UV_CACHE_DIR; uv 0.11 then
      # refuses `uv run --script` on those bundled skill scripts unless
      # project discovery is off.
      UV_NO_PROJECT: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install briefing dependencies
        run: pip install -r requirements.txt

      - name: Compute DATE_STR
        id: date
        run: |
          if [ -n "${{ inputs.date_str }}" ]; then
            date="${{ inputs.date_str }}"
          else
            date="$(date -u +%Y-%m-%d)"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Using DATE_STR=$date"

      - name: Show selected plots
        run: |
          echo "run_all=${{ inputs.run_all }}"
          echo "kenya_rainfall=${{ inputs.run_recent_rainfall_observations_kenya }}"
          echo "eastern_africa_rainfall=${{ inputs.run_recent_rainfall_observations_eastern_africa }}"
          echo "station_data=${{ inputs.run_recent_observations_station_data }}"
          echo "seasonal_progression=${{ inputs.run_seasonal_progression }}"
          echo "analog_years=${{ inputs.run_seasonal_progression_vs_analog_years }}"
          echo "mjo=${{ inputs.run_equatorial_waves_mjo }}"
          echo "iod_enso=${{ inputs.run_equatorial_waves_iod_enso }}"
          echo "itcz=${{ inputs.run_itcz_state }}"
          echo "analyses_forecasts=${{ inputs.run_equatorial_waves_analyses_and_forecasts }}"
          echo "sst=${{ inputs.run_current_sst_conditions }}"
          echo "last_week_verification=${{ inputs.run_last_weeks_forecast_verification }}"
          echo "week1_mae_vs_chirps=${{ inputs.run_week1_mae_vs_chirps }}"
          echo "kenya_daily_downscaled_precip=${{ inputs.run_kenya_daily_downscaled_precip }}"
          echo "timeseries_verification=${{ inputs.run_timeseries_verification }}"

      - name: Run recent_rainfall_observations_kenya.sh
        if: ${{ inputs.run_all == true || inputs.run_recent_rainfall_observations_kenya == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash recent_rainfall_observations_kenya.sh

      - name: Run recent_rainfall_observations_eastern_africa.sh
        if: ${{ inputs.run_all == true || inputs.run_recent_rainfall_observations_eastern_africa == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash recent_rainfall_observations_eastern_africa.sh

      - name: Run recent_observations_station_data.sh
        if: ${{ inputs.run_all == true || inputs.run_recent_observations_station_data == true }}
        continue-on-error: true
        working-directory: ws_scripts
        env:
          TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
          TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
        run: bash recent_observations_station_data.sh

      - name: Run seasonal_progression.sh
        if: ${{ inputs.run_all == true || inputs.run_seasonal_progression == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash seasonal_progression.sh

      - name: Run seasonal_progression_vs_analog_years.sh
        if: ${{ inputs.run_all == true || inputs.run_seasonal_progression_vs_analog_years == true }}
        continue-on-error: true
        working-directory: ws_scripts
        env:
          ECMWF_DATASTORES_URL: "https://ecds.ecmwf.int/api"
          ECMWF_DATASTORES_KEY: ${{ secrets.CDSAPI_KEY }}
        run: bash seasonal_progression_vs_analog_years.sh

      - name: Run equatorial_waves_mjo.sh
        if: ${{ inputs.run_all == true || inputs.run_equatorial_waves_mjo == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash equatorial_waves_mjo.sh

      - name: Run equatorial_waves_iod_enso.sh
        if: ${{ inputs.run_all == true || inputs.run_equatorial_waves_iod_enso == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash equatorial_waves_iod_enso.sh

      - name: Run itcz_state.sh
        if: ${{ inputs.run_all == true || inputs.run_itcz_state == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash itcz_state.sh

      - name: Run equatorial_waves_analyses_and_forecasts.sh
        if: ${{ inputs.run_all == true || inputs.run_equatorial_waves_analyses_and_forecasts == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash equatorial_waves_analyses_and_forecasts.sh

      - name: Run current_sst_conditions.sh
        if: ${{ inputs.run_all == true || inputs.run_current_sst_conditions == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash current_sst_conditions.sh

      - name: Run last_weeks_forecast_verification.sh
        if: ${{ inputs.run_all == true || inputs.run_last_weeks_forecast_verification == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash last_weeks_forecast_verification.sh

      - name: Run week1_mae_vs_chirps.sh
        if: ${{ inputs.run_all == true || inputs.run_week1_mae_vs_chirps == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash week1_mae_vs_chirps.sh

      - name: Run kenya_daily_downscaled_precip.sh
        if: ${{ inputs.run_all == true || inputs.run_kenya_daily_downscaled_precip == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash kenya_daily_downscaled_precip.sh

      - name: Run timeseries_verification.sh
        if: ${{ inputs.run_timeseries_verification == true }}
        continue-on-error: true
        working-directory: ws_scripts
        run: bash timeseries_verification.sh

      - name: Collect briefing plots
        run: |
          mkdir -p "plots/briefing/${{ steps.date.outputs.date }}"
          mv ws_scripts/*.png "plots/briefing/${{ steps.date.outputs.date }}/" 2>/dev/null || true

      - name: Install rclone
        continue-on-error: true
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Generate AI weather briefing
        continue-on-error: true
        env:
          DATE_STR: ${{ steps.date.outputs.date }}
          MAIN_PATH: ${{ github.workspace }}/
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRIEFING_TEMPLATE_ID: "1zSp3C35PqDfMKbT8WtEcxoG2EoyIAJA5"
          BRIEFING_ALLOW_MISSING_PICTURES: "1"
        run: python ai_weather_briefing.py

      - name: Upload briefing plots
        uses: actions/upload-artifact@v4
        with:
          name: briefing-plots
          path: plots/briefing/${{ steps.date.outputs.date }}/*.png
          if-no-files-found: warn

      - name: Upload briefing pptx
        uses: actions/upload-artifact@v4
        with:
          name: briefing-pptx
          path: s2s_briefing_${{ steps.date.outputs.date }}.pptx
          if-no-files-found: warn
