name: Test Pipeline (manual)

# Sandbox for trying out new/changed pipeline steps before they go into the
# production workflows (daily_download2.0.yml, daily_download2.0_kenya_only.yml,
# specific_download.yml). Runs the same core stages against a date/country list
# you choose, and emails you the results directly instead of touching the
# production GCS bucket, the subscriber sheet, or the main/website branches.
#
# Each stage can be turned off. Tick skills_only to skip every non-ws_scripts
# stage (download, plot_s2s, Indian Ocean, climate indices, GEFS, downscale,
# rainfall onset) in one go; those still restore from GCS. Fill ws_scripts
# with comma-separated stems to rebuild only those briefing plots (blank
# keeps the current "all except timeseries_verification" set).
# use_dev_template is ON by default here, so ai_weather_briefing.py builds from
# the dev Slides deck; untick it to test against the live template.
#
# Dates work like daily_download2.0_kenya_only.yml: date_str is the run/briefing
# date (BRIEFING_DATE), and the ECMWF/GEFS model date (DATE_STR) is two days
# earlier. Forecast data and plots/<country>/ use DATE_STR; plots/briefing/,
# the pptx and the digest use BRIEFING_DATE.
#
# A skipped stage
# pulls its known output for DATE_STR from the (read-only) production GCS
# bucket instead of regenerating it, so downstream stages/the email still
# have something to work with. One
# known gap, harmless (continue-on-error is set throughout so nothing
# blocks the run):
#   - run_rainfall_onset.py's data/<date>/rainfall_onset_s2s_Kenya.nc is never
#     uploaded to GCS either. Skip rainfall_onset and ai_briefing's Kenya
#     onset write-up will just be missing from the digest.
#
# Convention: when you add a new step here to test it, ask before also adding
# it to the production workflow files, and ask again once it's been tested
# whether it should go in.

on:
  workflow_dispatch:
    inputs:
      date_str:
        description: "Run date YYYY-MM-DD (blank = today UTC). The ECMWF model date is two days earlier."
        required: false
        default: ""
      countries:
        description: "Comma-separated country list (e.g. Kenya,Ghana)"
        required: true
        default: "Kenya"
      email:
        description: "Where to send the test run results"
        required: false
        default: "genevieve@rhizaresearch.org"
      skills_only:
        description: "Skip all non-weather-skills stages (download / plot_s2s / GEFS / downscale / onset / Indian Ocean / climate indices). Overrides the per-stage boxes below — they stay ticked in this form but are not honoured. Still runs ws_scripts + AI briefing; skipped stages restore from GCS."
        type: boolean
        default: false
      run_download:
        description: "Download ECMWF S2S + GEFS forecast data"
        type: boolean
        default: true
      run_plot_s2s:
        description: "Generate plot_s2s.py weekly/dekadal/monthly plots"
        type: boolean
        default: true
      run_indian_ocean_state:
        description: "Generate Indian Ocean state plot"
        type: boolean
        default: true
      run_climate_indices:
        description: "Generate climate indices timeseries"
        type: boolean
        default: true
      run_plot_gefs:
        description: "Generate GEFS plots"
        type: boolean
        default: true
      run_downscale_dekade:
        description: "Perform downscaling"
        type: boolean
        default: true
      run_rainfall_onset:
        description: "Run rainfall onset"
        type: boolean
        default: true
      run_briefing_slides:
        description: "Run ws_scripts briefing slides (Kenya-only). Filtered by ws_scripts when that box is filled."
        type: boolean
        default: true
      ws_scripts:
        description: "Optional subset of ws_scripts stems, comma-separated, no .sh. Blank + run_briefing_slides = all except timeseries_verification. Example: kenya_daily_downscaled_precip,week1_mae_vs_chirps"
        required: false
        default: ""
      run_ai_briefing:
        description: "Generate AI weather briefing (Kenya/Great_Horn-only, ignores countries input)"
        type: boolean
        default: true
      use_dev_template:
        description: "Build the briefing from the dev Slides template (on by default here; untick to use the live template)"
        type: boolean
        default: true
      dev_template_id:
        description: "Drive file id of the dev template (blank = the built-in dev deck)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: data
      BUCKET: africa-forecasting-data
      RUN_DATE_IN: ${{ inputs.date_str }}
      TEST_EMAIL: ${{ inputs.email || 'genevieve@rhizaresearch.org' }}
      COUNTRIES: ${{ inputs.countries }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
      TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}

    steps:
      # Same split as daily_download2.0_kenya_only.yml: the input is the
      # run/briefing date, the ECMWF model init is two days earlier.
      - name: Resolve run and ECMWF dates
        run: |
          run="${RUN_DATE_IN// /}"
          run="${run:-$(date -u +%Y-%m-%d)}"
          if ! [[ "$run" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$run" >/dev/null 2>&1; then
            echo "::error::Run date must be a real YYYY-MM-DD date (got: $run)"
            exit 1
          fi
          ecmwf=$(date -u -d "$run - 2 days" +%Y-%m-%d)
          echo "BRIEFING_DATE=$run" >> "$GITHUB_ENV"
          echo "DATE_STR=$ecmwf" >> "$GITHUB_ENV"
          echo "Run date $run; ECMWF model date $ecmwf  email=$TEST_EMAIL"

      - name: Show effective stage plan
        env:
          SKILLS_ONLY: ${{ inputs.skills_only }}
        run: |
          # skills_only overrides every per-stage box below it. The GitHub
          # workflow_dispatch form has no way to untick one input from another,
          # so those boxes still read "true" in the UI — this table is what the
          # run actually does.
          stage() {
            if [ "$SKILLS_ONLY" = "true" ]; then
              echo "| $1 | \`$2\` | skipped (skills_only) → restore from GCS |"
            elif [ "$2" = "true" ]; then
              echo "| $1 | \`true\` | run |"
            else
              echo "| $1 | \`false\` | skipped → restore from GCS |"
            fi
          }
          {
            echo "### Effective stage plan (skills_only=$SKILLS_ONLY)"
            echo
            echo "| Stage | Box | Effect |"
            echo "| --- | --- | --- |"
            stage download            "${{ inputs.run_download }}"
            stage plot_s2s            "${{ inputs.run_plot_s2s }}"
            stage indian_ocean_state  "${{ inputs.run_indian_ocean_state }}"
            stage climate_indices     "${{ inputs.run_climate_indices }}"
            stage plot_gefs           "${{ inputs.run_plot_gefs }}"
            stage downscale_dekade    "${{ inputs.run_downscale_dekade }}"
            stage rainfall_onset      "${{ inputs.run_rainfall_onset }}"
            echo
            echo "briefing_slides=${{ inputs.run_briefing_slides }}, ai_briefing=${{ inputs.run_ai_briefing }} (both unaffected by skills_only)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the branch selected in the Actions "Run workflow" dropdown
          # (workflow_dispatch default). Do not pin main — that ignored the
          # selected ref and always ran production code.
          path: main_repo

      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website_branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements.txt

      # ── GCS is read-only here (rsync FROM the bucket only). Drive
      # upload goes to the TEST subfolder, never the live briefing folder
      # root. publish_briefing_to_drive.py refuses --live in Test* workflows. ─────
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: 'access_token'
          access_token_scopes: "https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ── Stage: download ────────────────────────────────────────────
      - name: Run download script
        if: ${{ inputs.run_download && !inputs.skills_only }}
        uses: nick-fields/retry@v3
        continue-on-error: true
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: |
            cd main_repo
            python download_s2s.py

      - name: Fetch forecast
        if: ${{ inputs.run_download && !inputs.skills_only }}
        working-directory: main_repo
        run: |
          uv run fetch_dynamical.py \
            --dataset noaa-gefs-forecast-35-day\
            --date ${{ env.DATE_STR }} \
            --countries "${{ inputs.countries }}"\
            --variable precipitation_surface \
            --output ./data/${{ env.DATE_STR }}/gefs/

      - name: Restore forecast data from GCS
        if: ${{ !inputs.run_download || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "data/${DATE_STR}"
          gcloud storage rsync -r "gs://${BUCKET}/data/${DATE_STR}" "data/${DATE_STR}"

      # ── Stage: plot_s2s ────────────────────────────────────────────
      - name: Generate plots
        if: ${{ inputs.run_plot_s2s && !inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_s2s.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          WEBSITE_PATH: ${{ github.workspace }}/website_branch/
          AI_ACTIVE: 'True'

      - name: Restore plot_s2s plots from GCS
        if: ${{ !inputs.run_plot_s2s || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            for sub in weekly dekadal monthly; do
              src="plots/$country/$DATE_STR/$sub"
              mkdir -p "$src"
              gcloud storage rsync -r "gs://${BUCKET}/$src" "$src" || true
            done
          done

      # ── Stage: indian_ocean_state ─────────────────────────────────
      - name: Generate Indian Ocean state plot
        if: ${{ inputs.run_indian_ocean_state && !inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python IndianOceanState.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Restore Indian Ocean state plot from GCS
        if: ${{ !inputs.run_indian_ocean_state || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "plots/diagnostics/${DATE_STR}"
          gcloud storage rsync -r "gs://${BUCKET}/plots/diagnostics/${DATE_STR}" "plots/diagnostics/${DATE_STR}"

      # ── Stage: climate_indices_timeseries ───────────────────────────
      - name: Generate climate indices timeseries
        if: ${{ inputs.run_climate_indices && !inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python climate_indices_timeseries.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Restore climate indices timeseries from GCS
        if: ${{ !inputs.run_climate_indices || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "data/${DATE_STR}/diagnostics"
          gcloud storage rsync -r "gs://${BUCKET}/data/${DATE_STR}/diagnostics" "data/${DATE_STR}/diagnostics"

      # ── Stage: plot_gefs ───────────────────────────────────────────
      - name: Generate GEFS plots
        if: ${{ inputs.run_plot_gefs && !inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_gefs.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Restore GEFS plots from GCS
        if: ${{ !inputs.run_plot_gefs || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            for sub in weekly dekadal monthly; do
              src="plots/$country/$DATE_STR/$sub"
              mkdir -p "$src"
              gcloud storage rsync -r "gs://${BUCKET}/$src" "$src" || true
            done
          done

      # ── Stage: downscale_dekade ─────────────────────────────────────
      # Derives its own weekly/dekadal aggregates from the precip zarr, so it
      # runs whether or not plot_s2s ran in this job.
      - name: Perform downscaling
        if: ${{ inputs.run_downscale_dekade && !inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python dowscale_dekade.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DEKADE_COUNTRIES: ${{ inputs.countries }}
          WEEK_COUNTRIES: ${{ inputs.countries }}

      - name: Restore downscaled plots from GCS
        if: ${{ !inputs.run_downscale_dekade || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            for sub in weekly dekadal; do
              src="plots/$country/$DATE_STR/$sub"
              mkdir -p "$src"
              gcloud storage rsync -r "gs://${BUCKET}/$src" "$src" || true
            done
          done

      - name: Install rclone
        continue-on-error: true
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      # ── Stage: rainfall_onset ────────────────────────────────────────
      - name: Run rainfall onset
        if: ${{ inputs.run_rainfall_onset && !inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            echo "Rainfall onset: $country"
            COUNTRY="$country" python run_rainfall_onset.py || true
          done
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Restore rainfall onset plots from GCS
        if: ${{ !inputs.run_rainfall_onset || inputs.skills_only }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            src="plots/$country/$DATE_STR/monthly"
            mkdir -p "$src"
            gcloud storage rsync -r "gs://${BUCKET}/$src" "$src" || true
          done

      # ── Stage: briefing_slides (ws_scripts/*.sh, Kenya-hardcoded) ──
      - name: Resolve ws_scripts selection
        id: ws
        run: |
          allowed=(
            recent_rainfall_observations_kenya
            recent_rainfall_observations_eastern_africa
            recent_observations_station_data
            seasonal_progression
            seasonal_progression_vs_analog_years
            equatorial_waves_mjo
            equatorial_waves_iod_enso
            itcz_state
            equatorial_waves_analyses_and_forecasts
            current_sst_conditions
            last_weeks_forecast_verification
            week1_mae_vs_chirps
            kenya_daily_downscaled_precip
            timeseries_verification
          )
          # timeseries_verification stays opt-in; it is still flaky.
          default=(
            recent_rainfall_observations_kenya
            recent_rainfall_observations_eastern_africa
            recent_observations_station_data
            seasonal_progression
            seasonal_progression_vs_analog_years
            equatorial_waves_mjo
            equatorial_waves_iod_enso
            itcz_state
            equatorial_waves_analyses_and_forecasts
            current_sst_conditions
            last_weeks_forecast_verification
            week1_mae_vs_chirps
            kenya_daily_downscaled_precip
          )
          raw='${{ inputs.ws_scripts }}'
          raw="${raw// /}"
          raw="${raw//$'\n'/}"
          declare -a want=()
          if [ -n "$raw" ]; then
            IFS=',' read -ra tokens <<< "$raw"
            for t in "${tokens[@]}"; do
              t="${t%.sh}"
              [ -z "$t" ] && continue
              if [ "$t" = "all" ]; then
                want+=("${default[@]}")
              else
                want+=("$t")
              fi
            done
          elif [ "${{ inputs.run_briefing_slides }}" = "true" ]; then
            want=("${default[@]}")
          fi
          unknown=()
          selected=()
          for w in "${want[@]}"; do
            ok=0
            for a in "${allowed[@]}"; do
              if [ "$w" = "$a" ]; then ok=1; break; fi
            done
            if [ "$ok" = "0" ]; then
              unknown+=("$w")
              continue
            fi
            echo "$w=true" >> "$GITHUB_OUTPUT"
            selected+=("$w")
          done
          if [ ${#unknown[@]} -gt 0 ]; then
            echo "Unknown ws_scripts: ${unknown[*]}" >&2
            echo "Allowed: ${allowed[*]}" >&2
            exit 1
          fi
          any=false
          [ ${#selected[@]} -gt 0 ] && any=true
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Selected ws_scripts (${#selected[@]}): ${selected[*]:-none}"

      - name: Install uv for ws_scripts
        if: ${{ steps.ws.outputs.any == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"

      - name: Run recent_rainfall_observations_kenya.sh
        if: ${{ steps.ws.outputs.recent_rainfall_observations_kenya == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_rainfall_observations_kenya.sh

      - name: Run recent_rainfall_observations_eastern_africa.sh
        if: ${{ steps.ws.outputs.recent_rainfall_observations_eastern_africa == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_rainfall_observations_eastern_africa.sh

      - name: Run recent_observations_station_data.sh
        if: ${{ steps.ws.outputs.recent_observations_station_data == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_observations_station_data.sh

      - name: Run seasonal_progression.sh
        if: ${{ steps.ws.outputs.seasonal_progression == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash seasonal_progression.sh

      - name: Run seasonal_progression_vs_analog_years.sh
        if: ${{ steps.ws.outputs.seasonal_progression_vs_analog_years == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        env:
          ECMWF_DATASTORES_URL: "https://ecds.ecmwf.int/api"
          ECMWF_DATASTORES_KEY: ${{ secrets.CDSAPI_KEY }}
        run: bash seasonal_progression_vs_analog_years.sh

      - name: Run equatorial_waves_mjo.sh
        if: ${{ steps.ws.outputs.equatorial_waves_mjo == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_mjo.sh

      - name: Run equatorial_waves_iod_enso.sh
        if: ${{ steps.ws.outputs.equatorial_waves_iod_enso == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_iod_enso.sh

      - name: Run itcz_state.sh
        if: ${{ steps.ws.outputs.itcz_state == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash itcz_state.sh

      - name: Run equatorial_waves_analyses_and_forecasts.sh
        if: ${{ steps.ws.outputs.equatorial_waves_analyses_and_forecasts == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_analyses_and_forecasts.sh

      - name: Run current_sst_conditions.sh
        if: ${{ steps.ws.outputs.current_sst_conditions == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash current_sst_conditions.sh

      - name: Run last_weeks_forecast_verification.sh
        if: ${{ steps.ws.outputs.last_weeks_forecast_verification == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash last_weeks_forecast_verification.sh

      - name: Run week1_mae_vs_chirps.sh
        if: ${{ steps.ws.outputs.week1_mae_vs_chirps == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash week1_mae_vs_chirps.sh

      - name: Run kenya_daily_downscaled_precip.sh
        if: ${{ steps.ws.outputs.kenya_daily_downscaled_precip == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash kenya_daily_downscaled_precip.sh

      - name: Run timeseries_verification.sh
        if: ${{ steps.ws.outputs.timeseries_verification == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash timeseries_verification.sh

      # Seed briefing PNGs from GCS first. Collect then overwrites any
      # name the ws_scripts just produced (gcloud rsync is not additive —
      # a later pull would replace fresh GEFS/AIFS/… files with the bucket).
      - name: Restore briefing slides from GCS
        if: ${{ steps.ws.outputs.any == 'true' || inputs.run_ai_briefing }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "plots/briefing/${BRIEFING_DATE}"
          gcloud storage rsync -r "gs://${BUCKET}/plots/briefing/${BRIEFING_DATE}" "plots/briefing/${BRIEFING_DATE}" || true

      - name: Collect briefing plots
        if: ${{ steps.ws.outputs.any == 'true' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "plots/briefing/${{ env.BRIEFING_DATE }}"
          mv ws_scripts/*.png "plots/briefing/${{ env.BRIEFING_DATE }}/" 2>/dev/null || true

      # ── Stage: ai_briefing (Kenya/Great_Horn-hardcoded, ignores
      # countries input — top up its fixed prerequisites from GCS so
      # it has something to read even if you're testing a different country
      # or skipped an upstream stage above). Briefing PNGs were already
      # rsynced and then overwritten by collect; do not pull them again.
      - name: Top up ai_briefing prerequisites from GCS
        if: ${{ inputs.run_ai_briefing }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          for rel in \
            "plots/Kenya/${DATE_STR}" \
            "plots/Great_Horn/${DATE_STR}" \
            "plots/diagnostics/${DATE_STR}"
          do
            mkdir -p "$rel"
            gcloud storage rsync -r "gs://${BUCKET}/${rel}" "$rel" || true
          done

      # BRIEFING_TEMPLATE_ID picks which Google Slides deck
      # ai_weather_briefing.py exports as its pptx template. use_dev_template
      # defaults ON in this sandbox, so runs use the dev deck unless you untick
      # it; dev_template_id overrides the dev deck for a one-off. Either deck must
      # be link-viewable or shared with the workflow service account, or the
      # download falls back to the committed WeatherbriefingKenya_template3.pptx
      # (the echo below is how you tell which deck a run actually used).
      - name: Generate AI weather briefing
        if: ${{ inputs.run_ai_briefing }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          echo "briefing template id=$BRIEFING_TEMPLATE_ID (dev=${{ inputs.use_dev_template }})"
          python ai_weather_briefing.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ env.BRIEFING_DATE }}
          ECMWF_DATE_STR: ${{ env.DATE_STR }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRIEFING_TEMPLATE_ID: ${{ inputs.use_dev_template && (inputs.dev_template_id || '1McY75NyFK8DsSrJGXfFHLN7EMcQPuTX0') || '1zSp3C35PqDfMKbT8WtEcxoG2EoyIAJA5' }}
          BRIEFING_ALLOW_MISSING_PICTURES: "1"

      # Fresh Drive-scoped token immediately before upload. The job-start
      # auth is for GCS; setup-gcloud can replace it with a cloud-platform
      # token that Drive rejects (ACCESS_TOKEN_SCOPE_INSUFFICIENT).
      - name: Auth to Google Drive
        if: ${{ inputs.run_ai_briefing }}
        id: drive_auth
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Upload briefing to Drive TEST folder
        if: ${{ inputs.run_ai_briefing }}
        id: drive
        continue-on-error: true
        working-directory: main_repo
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.drive_auth.outputs.access_token }}
        run: |
          python -u publish_briefing_to_drive.py \
            --file "s2s_briefing_${{ env.BRIEFING_DATE }}.pptx" \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho" \
            --subfolder TEST \
            --emails "${{ env.TEST_EMAIL }}"

      # ── Convert NetCDF → JSON and update catalog (local only — never
      # committed/pushed, website_branch is discarded at the end) ──────
      - name: Convert NetCDF and update catalog
        working-directory: website_branch
        continue-on-error: true
        env:
          NCDF_DIR:       ncdf_data
          OUTPUT_DIR:     data/weekly
          CATALOG_PATH:   data/weekly/catalog.json
          VARIABLES:      "temp,precip,u10,v10,w500,u700,v700,tcw,cape,d2m,mn2t6,mx2t6"
          N_WEEKS:        "6"
          KEEP_FORECASTS: "5"
        run: |
          python scripts/nc_to_json_and_catalog.py \
            --ncdf-dir    "${{ env.NCDF_DIR }}" \
            --output-dir  "${{ env.OUTPUT_DIR }}" \
            --catalog     "${{ env.CATALOG_PATH }}" \
            --variables   "${{ env.VARIABLES }}" \
            --n-weeks     "${{ env.N_WEEKS }}" \
            --keep        "${{ env.KEEP_FORECASTS }}"

      - name: Remove website worktree
        continue-on-error: true
        run: rm -rf website_branch

      - name: Upload test run artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-pipeline-${{ env.BRIEFING_DATE }}
          if-no-files-found: warn
          path: |
            main_repo/plots/**/${{ env.DATE_STR }}/**
            main_repo/plots/briefing/${{ env.BRIEFING_DATE }}/**
            main_repo/prompts/digest_${{ env.BRIEFING_DATE }}.txt
            main_repo/s2s_briefing_${{ env.BRIEFING_DATE }}.pptx

      - name: Build attachment list
        id: attachments
        continue-on-error: true
        run: |
          set -euo pipefail
          MAX_BYTES=9500000
          mapfile -t files < <(
            {
              find main_repo/plots/briefing -type f -name '*.png' 2>/dev/null
              find main_repo/plots main_repo/private_plots main_repo/ws_scripts \
                -type f -name '*.png' 2>/dev/null | grep -v '/plots/briefing/' || true
            } | sort -u
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "note=No PNGs found." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total=0
          for f in "${files[@]}"; do
            total=$((total + $(stat -c%s "$f")))
          done
          echo "Found ${#files[@]} PNGs totaling ${total} bytes"
          if [ "$total" -le "$MAX_BYTES" ]; then
            list=$(IFS=,; echo "${files[*]}")
            echo "list=$list" >> "$GITHUB_OUTPUT"
            echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
            echo "note=All ${#files[@]} PNGs are attached." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zip -q main_repo/test_run_plots.zip "${files[@]}"
          zip_bytes=$(stat -c%s main_repo/test_run_plots.zip)
          echo "Zip is ${zip_bytes} bytes"
          if [ "$zip_bytes" -le "$MAX_BYTES" ]; then
            echo "list=main_repo/test_run_plots.zip" >> "$GITHUB_OUTPUT"
            echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
            echo "note=All ${#files[@]} PNGs packed into a zip (over Resend's 10 MB as individuals)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prefer briefing plots, then fill remaining budget.
          packed=()
          packed_bytes=0
          for f in "${files[@]}"; do
            sz=$(stat -c%s "$f")
            if [ $((packed_bytes + sz)) -le "$MAX_BYTES" ]; then
              packed+=("$f")
              packed_bytes=$((packed_bytes + sz))
            fi
          done
          list=$(IFS=,; echo "${packed[*]}")
          skipped=$(( ${#files[@]} - ${#packed[@]} ))
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "count=${#packed[@]}" >> "$GITHUB_OUTPUT"
          echo "note=Attached ${#packed[@]} of ${#files[@]} PNGs (${skipped} omitted — Resend 10 MB cap). Full set is in the run artifacts." >> "$GITHUB_OUTPUT"

      - name: Email test run results (Kenya)
        if: ${{ contains(inputs.countries, 'Kenya') }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "[TEST] S2S Pipeline Run — ${{ env.BRIEFING_DATE }} (${{ inputs.countries }})"
          to: ${{ env.TEST_EMAIL }}
          from: "S2S Test Pipeline <info@dashboards.rhizaresearch.org>"
          body: |
            Test pipeline run for date ${{ env.BRIEFING_DATE }} (ECMWF model date ${{ env.DATE_STR }}), countries: ${{ inputs.countries }}.
            Shared test deck (Drive TEST folder, not the live briefing folder):
            ${{ steps.drive.outputs.drive_url || '(upload failed)' }}
            ${{ steps.attachments.outputs.note || '' }}
            pptx is in artifacts / Drive TEST, not attached (Resend 10 MB cap).
            Full output: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Nothing from this run was uploaded to GCS or committed to main/website.
          attachments: ${{ steps.attachments.outputs.list }}

      - name: Email test run results
        if: ${{ !contains(inputs.countries, 'Kenya') }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "[TEST] S2S Pipeline Run — ${{ env.BRIEFING_DATE }} (${{ inputs.countries }})"
          to: ${{ env.TEST_EMAIL }}
          from: "S2S Test Pipeline <info@dashboards.rhizaresearch.org>"
          body: |
            Test pipeline run for date ${{ env.BRIEFING_DATE }} (ECMWF model date ${{ env.DATE_STR }}), countries: ${{ inputs.countries }}.
            ${{ steps.attachments.outputs.note || '' }}
            Full output: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Nothing from this run was uploaded to GCS or committed to main/website — this is
            output from the test workflow only. Any stage you turned off was backfilled from
            the production GCS bucket instead of regenerated.
          attachments: ${{ steps.attachments.outputs.list }}
