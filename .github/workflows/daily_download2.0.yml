name: Daily ECMWF Download

permissions:
  contents: write

on:
  schedule:
    - cron: "16 00 * * *"  # every day at 02:00 UTC
  workflow_dispatch:      # allows manual run

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run download script
        env:
          ECMWF_API_URL: ${{ secrets.ECMWF_API_URL }}
          ECMWF_API_KEY: ${{ secrets.ECMWF_API_KEY }}
          ECMWF_API_EMAIL: ${{ secrets.ECMWF_API_EMAIL }}
        run: |
          python download_s2s.py

      - name: Upload GRIB file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_grib
          path: data/*.grib

      - name: Generate plots
        run: |
          python plot_s2s.py
      - name: Upload plots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s2s_plots
          path: plots/**/*.png
      - name: Upload netCDF file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_nc
          path: data/*.nc
      - name: perform downscaling
        run: |
          python dowscale_dekade.py
      - name: Upload plots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: downscale_plots
          path: plots/**/*.png
      - name: Upload netCDF file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_nc
          path: data/*.nc
      - name: Save generated files in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plots/
          git add data/
          git commit -m "Daily automated update" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
