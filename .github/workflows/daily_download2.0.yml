name: Daily ECMWF Download

permissions:
  contents: write
  id-token: write

on:
  # Scheduling moved off GitHub: an external cron POSTs to the REST
  # workflow_dispatch endpoint for this file instead. Re-enable this block
  # only if that external trigger goes away, or the pipeline will run twice.
  # schedule:
  #  - cron: "33 02 * * *" # every day at 02:33 UTC
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    # the email job attaches plots from these dates
    outputs:
      run_date: ${{ steps.dates.outputs.run_date }}
      ecmwf_date: ${{ steps.dates.outputs.ecmwf_date }}
      date_04deg: ${{ steps.date_04deg.outputs.date }}
      downscaled_date: ${{ steps.downscaled_date.outputs.date }}
    env:
      DATA_BRANCH: main
      WEBSITE_BRANCH: website
      DATA_DIR: website_data
      OUTPUT_DIR: data
      BUCKET: africa-forecasting-data
      KENYA_BUCKET: kenya-forecasting-data
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
      TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
      # uvx unpacks forecasting-skills into UV_CACHE_DIR; uv 0.11 then
      # refuses `uv run --script` on those bundled skill scripts unless
      # project discovery is off.
      UV_NO_PROJECT: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo

      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website_branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements.txt

      - name: Resolve run and ECMWF dates
        id: dates
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          run = datetime.now(timezone.utc).date()
          # Model init lags the run: products for a briefing dated `run`
          # are the ECMWF forecast from two days earlier.
          ecmwf = run - timedelta(days=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run_date={run.isoformat()}\n")
              fh.write(f"ecmwf_date={ecmwf.isoformat()}\n")
          print(f"Run date {run.isoformat()}; ECMWF model date {ecmwf.isoformat()}")
          PY

      - name: Run download script (dynamical.org)
        id: download_primary
        uses: nick-fields/retry@v3
        continue-on-error: true
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
          DATE_STR: ${{ steps.dates.outputs.ecmwf_date }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          # `|| exit 1` stops bash from exec'ing python directly: a signal
          # death (OOM kill, native crash) then becomes exit 1 instead of a
          # null code, which nick-fields/retry reports as success and which
          # would skip the CDS/ECDS fallback below.
          command: |
            cd main_repo
            python download_s2s.py || exit 1

      # dynamical.org's catalog occasionally lags the CDS/ECDS store it's
      # built from. Same model date, same zarr store names/layout (the
      # dynamical rewrite matched this script's output on purpose), just a
      # different source — so downstream steps don't need to know which one
      # ran. `outcome` (not `conclusion`) reflects the real result even
      # though the step above has continue-on-error: true.
      - name: Run download script (CDS/ECDS fallback)
        id: download_fallback
        if: steps.download_primary.outcome == 'failure'
        uses: nick-fields/retry@v3
        continue-on-error: true
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
          DATE_STR: ${{ steps.dates.outputs.ecmwf_date }}
        with:
          # CDS/ECDS requests queue server-side and are much slower than
          # dynamical.org, so this keeps the pre-dynamical 100-minute timeout.
          timeout_minutes: 100
          max_attempts: 3
          command: |
            cd main_repo
            python download_s2s_legacy.py

      - name: Get briefing date
        id: briefing_date
        run: echo "date=${{ steps.dates.outputs.run_date }}" >> $GITHUB_OUTPUT

      - name: Get ECMWF lagged date
        id: ecmwf_date
        run: echo "date=${{ steps.dates.outputs.ecmwf_date }}" >> $GITHUB_OUTPUT

      - name: Fetch forecast
        working-directory: main_repo
        run: |
          uv run fetch_dynamical.py \
            --dataset noaa-gefs-forecast-35-day\
            --date ${{ steps.ecmwf_date.outputs.date }} \
            --countries "Namibia,Botswana,Kenya,Zambia,Madagascar,Angola,Ghana,Senegal,Ethiopia,Zimbabwe,Malawi,Great_Horn,Somalia"\
            --variable precipitation_surface \
            --output ./data/${{ steps.ecmwf_date.outputs.date }}/gefs/  

      - name: Generate plots
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_s2s.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          WEBSITE_PATH: ${{ github.workspace }}/website_branch/
          COUNTRIES: "Namibia,Botswana,Kenya,Zambia,Madagascar,Angola,Ghana,Senegal,Ethiopia,Zimbabwe,Malawi,Great_Horn,Somalia"
          AI_ACTIVE: 'True'

      - name: Generate Indian Ocean state plot
        continue-on-error: true
        working-directory: main_repo
        run: |
          python IndianOceanState.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Generate climate indices timeseries
        continue-on-error: true
        working-directory: main_repo
        run: |
          python climate_indices_timeseries.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Generate GEFS plots
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_gefs.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Namibia,Botswana,Kenya,Zambia,Madagascar,Angola,Ghana,Senegal,Ethiopia,Zimbabwe,Malawi,Great_Horn,Somalia"

      # ── DWD ICON-EPS (40 members, one week) ────────────────────────
      # DWD keeps only the last ~24 h of runs, so this always takes the newest
      # 00 UTC run and works on its own date (ICON_DATE_STR = the init date,
      # usually the run date, newer than the ECMWF date): the stores go to
      # data/<ICON_DATE_STR>/ICON_eps_*.zarr and the plots to
      # plots/<country>/<ICON_DATE_STR>/icon/, both published by the upload
      # steps below (DWD open data, CC BY 4.0).
      - name: Download ICON-EPS
        id: icon_download
        continue-on-error: true
        working-directory: main_repo
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
          MAIN_PATH: ${{ github.workspace }}/main_repo/
        run: |
          set -o pipefail
          python download_icon_eps.py | tee "$RUNNER_TEMP/icon_download.log"
          # the script's last line is the init date; a failed variable is only
          # logged there, so check the store exists before passing the date on
          d=$(tail -n 1 "$RUNNER_TEMP/icon_download.log")
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::no ICON date in the download output"; exit 1; }
          python -c "import xarray as xr; print(xr.open_zarr('data/$d/ICON_eps_tot_prec_$d.zarr'))"
          echo "ICON_DATE_STR=$d" >> "$GITHUB_ENV"

      - name: Plot ICON-EPS
        if: ${{ steps.icon_download.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_icon.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Namibia,Botswana,Kenya,Zambia,Madagascar,Angola,Ghana,Senegal,Ethiopia,Zimbabwe,Malawi,Great_Horn,Somalia"

      - name: Perform downscaling
        continue-on-error: true
        working-directory: main_repo
        run: |
          python dowscale_dekade.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DEKADE_COUNTRIES: "Kenya,Great_Horn,Ethiopia,Somalia"
          WEEK_COUNTRIES: "Kenya,Ghana"

      # ── Authenticate to Google Cloud (Workload Identity Federation) ──
      # Done here rather than next to the uploads: the 0.4 degree steps below
      # read the private hindcast store. The upload steps later in the job
      # reuse this same session.
      - name: Auth to Google Cloud
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Setup gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # The 0.4 degree forecast for init X is on CHC's server by ~21:05 UTC on
      # day X, so this run usually has the init of the day before: the 0.4
      # degree products (and the Kenya downscaling made from them) are dated by
      # that init, a day newer than the ECMWF date. Falls back to the ECMWF date.
      # After the auth above: it also looks in the private archive of CHC files.
      - name: Resolve 0.4 degree date
        id: date_04deg
        working-directory: main_repo
        run: |
          python forecast_04deg_dates.py resolve \
            --run-date "${{ steps.dates.outputs.run_date }}" \
            --ecmwf-date "${{ steps.dates.outputs.ecmwf_date }}" \
            || echo "date=${{ steps.dates.outputs.ecmwf_date }}" >> "$GITHUB_OUTPUT"
        env:
          FORECAST_04DEG_URL: ${{ secrets.FORECAST_04DEG_URL }}

      # ── 0.4 degree precipitation ────────────────────────────────────
      # plot_s2s_04deg_.py downloads the CHC forecast from the address in the
      # FORECAST_04DEG_URL secret. The forecast itself is not public: it is kept
      # as private_data/forecast_04deg/<date>/ECMWF_s2s_precip_04deg_<init>.zarr
      # and its plots as private_plots/<country>/<date>/04deg/, outside data/
      # and plots/, so no step that publishes or emails those picks them up --
      # keep it that way. Only the derived plots (probabilities, EFI/SOT,
      # anomalies, spell lengths: PUBLIC_PLOTS in the script) are copied to
      # plots/<country>/<date>/04deg/ and uploaded with the rest of plots/.
      # downscale_04deg_.py then writes the Kenya weekly downscaled outputs
      # under their normal names -- but only when the forecast for its DATE_STR
      # and a hindcast close to that date are there; otherwise it exits and the
      # 1.5 degree outputs of the step above stay the run's downscaled forecast.
      # Both run on the 0.4 degree date (normally a day newer than the ECMWF
      # date), so their outputs go under that date's folders. The hindcasts are
      # read from the private gs://sheerwater-datalake/ecmwf-0_4 store with the
      # credentials of "Auth to Google Cloud" above, so the service account
      # needs read access to that bucket.
      - name: Generate 0.4 degree precip plots
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_s2s_04deg_.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Kenya,Ethiopia,Great_Horn,Somalia"
          DATE_STR: ${{ steps.date_04deg.outputs.date }}
          FORECAST_04DEG_URL: ${{ secrets.FORECAST_04DEG_URL }}

      - name: Perform 0.4 degree downscaling
        continue-on-error: true
        working-directory: main_repo
        run: |
          python downscale_04deg_.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.date_04deg.outputs.date }}
          # the 1.5 degree run whose days extend the rainfall onset forecast
          ONSET_1P5_DATE: ${{ steps.ecmwf_date.outputs.date }}

      # Yesterday's run made the 0.4 degree Kenya downscaling for today's ECMWF
      # date; dowscale_dekade.py's 1.5 degree outputs of the same names must not
      # replace it in the buckets. Restores it locally if today's 0.4 degree
      # downscaling didn't run.
      - name: Keep published 0.4 degree downscaling
        continue-on-error: true
        working-directory: main_repo
        run: |
          python forecast_04deg_dates.py keep-published \
            --date "${{ steps.ecmwf_date.outputs.date }}" \
            --date-04deg "${{ steps.date_04deg.outputs.date }}"
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      # The date the run's Kenya weekly downscaled forecast is under: the 0.4
      # degree date when that downscaling ran, else the ECMWF date. Everything
      # made from it below (onset, CHIRPS climatology maps, ws_scripts, briefing)
      # uses this date.
      - name: Resolve downscaled forecast date
        id: downscaled_date
        working-directory: main_repo
        run: |
          d04="${{ steps.date_04deg.outputs.date }}"
          if [ -n "$d04" ] && [ -f "data/$d04/data_weekly_Kenya_downscaled.nc" ]; then
            d="$d04"
          else
            d="${{ steps.ecmwf_date.outputs.date }}"
          fi
          echo "Downscaled forecast date: $d"
          echo "date=$d" >> "$GITHUB_OUTPUT"

      # ── OLR tropical waves + MJO OLR/RMM indices ─────────────────────
      # Needs the ERA5 archive (daily OLR 2006-now, 15S-15N u850/u200, BoM's
      # RMM file) kept in gs://${BUCKET}/era5/: pull it, top it up to the
      # latest ERA5T day from ARCO (only the missing days), push the changed
      # files back (appending ERA5 days is date-independent and idempotent).
      # Then the six scripts in order, on the ECMWF date; their forecast and
      # reforecast come from dynamical.org and Planette, not from the download
      # above. Only plots/olr_waves/<date>/ and data/<date>/mjo_*_index_<date>.nc
      # are published: the ~340 MB of intermediate zarrs are removed.
      - name: Pull ERA5 archive from GCS
        id: era5_pull
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p olr_obs
          gcloud storage rsync -r "gs://${BUCKET}/era5" olr_obs

      - name: Top up ERA5 archive
        if: ${{ steps.era5_pull.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python olr_obs_archive.py
          python rmm_wind_archive.py

      # always(): a partly topped-up archive is still worth saving (each
      # yearly file is written atomically); no deletes, so nothing is lost
      - name: Push ERA5 archive to GCS
        if: ${{ always() && steps.era5_pull.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          gcloud storage rsync -r olr_obs "gs://${BUCKET}/era5"

      - name: Download OLR for the wave filtering
        id: olr_download
        continue-on-error: true
        working-directory: main_repo
        run: python download_olr_waves.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: OLR wave anomalies
        id: olr_anom
        if: ${{ steps.olr_download.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python olr_wave_anomalies.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: OLR wave filtering
        id: olr_filter
        if: ${{ steps.olr_anom.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python olr_wave_filter.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      # Rainfall anomaly maps over East Africa / the western Indian Ocean with
      # the MJO (weekly) and Kelvin (daily) filtered OLR contoured on top.
      # Needs olr_waves_<date>.zarr, so it runs before the intermediates go.
      - name: Rainfall anomaly maps with wave OLR
        if: ${{ steps.olr_filter.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python olr_wave_rain_maps.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Download winds for the RMM index
        id: rmm_download
        if: ${{ steps.olr_anom.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python download_rmm_winds.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: MJO RMM index
        if: ${{ steps.rmm_download.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python mjo_rmm_index.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      # keep the intermediates out of the zarr upload below
      - name: Remove OLR wave intermediates
        if: ${{ always() }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          for s in ECMWF_s2s_olr ECMWF_s2s_olr_reforecast olr_anom olr_obs_leadin olr_waves; do
            rm -rf "data/$DATE_STR/${s}_$DATE_STR.zarr"
          done
          rm -f data/$DATE_STR/rmm_u_*_$DATE_STR.nc
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Run rainfall onset
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            echo "Rainfall onset: $country"
            COUNTRY="$country" python run_rainfall_onset.py || true
          done
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Kenya"
          DATE_STR: ${{ steps.downscaled_date.outputs.date }}

      # CHIRPS climatology counterparts of the downscaled onset/spell maps
      # (the briefing's "_clim" pictures, Kenya-only). Only the small derived
      # results are cached (chirps_clim_cache/: per calendar week and per
      # season), in the Actions cache since this workflow can't commit to main --
      # a cache key can't be overwritten, so restore the newest one by prefix and
      # save under a hash of the contents, which only adds an entry when this run
      # added a week or season.
      - name: Restore CHIRPS climatology cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: main_repo/chirps_clim_cache
          key: chirps-clim-Kenya-${{ github.run_id }}
          restore-keys: chirps-clim-Kenya-

      - name: Run CHIRPS climatology
        continue-on-error: true
        working-directory: main_repo
        run: |
          COUNTRY=Kenya python chirps_agro_climatology.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.downscaled_date.outputs.date }}

      - name: Save CHIRPS climatology cache
        if: ${{ hashFiles('main_repo/chirps_clim_cache/**/*.nc') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: main_repo/chirps_clim_cache
          key: chirps-clim-Kenya-${{ hashFiles('main_repo/chirps_clim_cache/**/*.nc') }}

      - name: Replot precip with shared color scale
        continue-on-error: true
        working-directory: main_repo
        run: |
          python replot_precip_shared_colorscale.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}
          DOWNSCALED_DATE_STR: ${{ steps.downscaled_date.outputs.date }}

      # ── Publish Kenya bucket contents before the ws_scripts run ──────
      # seasonal_progression_vs_analog_years.sh and kenya_daily_downscaled_precip.sh
      # read today's downscaled forecast back from gs://${KENYA_BUCKET}. Uploading
      # it only after they ran made them silently use the previous init. Everything
      # staged here is produced by the steps above. The Auth/Setup steps further
      # down re-run to refresh credentials for the later uploads.
      - name: Auth to Google Cloud (Kenya bucket)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Setup gcloud (Kenya bucket)
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ── Stage Kenya-only plots, downscaled NetCDF, and cropped zarr data ──
      # For the ECMWF date and, when it differs, the downscaled forecast's (0.4
      # degree) date.
      - name: Stage Kenya bucket contents
        continue-on-error: true
        working-directory: main_repo
        run: |
          for d in $(printf '%s\n' "${{ steps.ecmwf_date.outputs.date }}" "${{ steps.downscaled_date.outputs.date }}" | sort -u); do
            STAGE_DIR="kenya_bucket_staging/$d"
            mkdir -p "$STAGE_DIR"
            for sub in weekly dekadal monthly 04deg; do
              src="plots/Kenya/$d/$sub"
              if [ -d "$src" ]; then
                mkdir -p "$STAGE_DIR/$sub"
                cp -r "$src"/. "$STAGE_DIR/$sub/"
              fi
            done
            mkdir -p "$STAGE_DIR/data"
            if [ -d "$OUTPUT_DIR/$d/gefs" ]; then
              mkdir -p "$STAGE_DIR/data/gefs"
              cp -r "$OUTPUT_DIR/$d/gefs/gefs_kenya.zarr" "$STAGE_DIR/data/gefs/" 2>/dev/null || true
            fi
            if [ -d "$OUTPUT_DIR/$d/geotifs_kenya" ]; then
              cp -r "$OUTPUT_DIR/$d/geotifs_kenya" "$STAGE_DIR/data/"
            fi
            if [ -d "$OUTPUT_DIR/$d" ]; then
              find "$OUTPUT_DIR/$d" -maxdepth 1 \
                -type f -iname '*Kenya*downscaled*.nc' \
                -exec cp -v {} "$STAGE_DIR/data/" \;
              find "$OUTPUT_DIR/$d" -maxdepth 1 \
                -type f -iname 'daily_downscaled_kenya.tif' \
                -exec cp -v {} "$STAGE_DIR/data/" \;
            fi
            python crop_kenya_zarr.py \
              --data-dir "$OUTPUT_DIR/$d" \
              --output "$STAGE_DIR/data" || echo "::warning::crop_kenya_zarr.py failed for $d"
          done

      # ── Upload Kenya-only bucket contents ─────────────────────────
      - name: Upload to Kenya bucket
        continue-on-error: true
        working-directory: main_repo
        run: |
          found=false
          for STAGE_DIR in kenya_bucket_staging/*/; do
            [ -d "$STAGE_DIR" ] || continue
            found=true
            d=$(basename "$STAGE_DIR")
            gcloud storage rsync -r "$STAGE_DIR" "gs://${KENYA_BUCKET}/$d" --exclude='.*index\.md$'
          done
          $found || echo "No Kenya staging directory found, skipping."

      # ── Weather-skills briefing plots (ws_scripts/*.sh) ──────
      - name: Install uv for ws_scripts
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"

      - name: Run recent_rainfall_observations_kenya.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_rainfall_observations_kenya.sh

      - name: Run recent_rainfall_observations_eastern_africa.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_rainfall_observations_eastern_africa.sh

      - name: Run recent_observations_station_data.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_observations_station_data.sh

      - name: Run seasonal_progression.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash seasonal_progression.sh

      - name: Run seasonal_progression_vs_analog_years.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        env:
          INIT_OVERRIDE: ${{ steps.downscaled_date.outputs.date }}
          ECMWF_DATASTORES_URL: "https://ecds.ecmwf.int/api"
          ECMWF_DATASTORES_KEY: ${{ secrets.CDSAPI_KEY }}
        run: bash seasonal_progression_vs_analog_years.sh

      - name: Run equatorial_waves_mjo.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_mjo.sh

      - name: Run equatorial_waves_iod_enso.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_iod_enso.sh

      - name: Run itcz_state.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash itcz_state.sh

      - name: Run equatorial_waves_analyses_and_forecasts.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_analyses_and_forecasts.sh

      - name: Run current_sst_conditions.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash current_sst_conditions.sh

      - name: Run last_weeks_forecast_verification.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash last_weeks_forecast_verification.sh

      - name: Run week1_mae_vs_chirps.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash week1_mae_vs_chirps.sh

      - name: Run kenya_daily_downscaled_precip.sh
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        env:
          INIT_OVERRIDE: ${{ steps.downscaled_date.outputs.date }}
        run: bash kenya_daily_downscaled_precip.sh

    #  - name: Run timeseries_verification.sh
    #    continue-on-error: true
     #   working-directory: main_repo/ws_scripts
     #   run: bash timeseries_verification.sh

      - name: Collect briefing plots
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "plots/briefing/${{ steps.briefing_date.outputs.date }}"
          mv ws_scripts/*.png "plots/briefing/${{ steps.briefing_date.outputs.date }}/" 2>/dev/null || true

      - name: Install rclone
        continue-on-error: true
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Generate AI weather briefing
        continue-on-error: true
        working-directory: main_repo
        run: |
          python ai_weather_briefing.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.briefing_date.outputs.date }}
          ECMWF_DATE_STR: ${{ steps.ecmwf_date.outputs.date }}
          DOWNSCALED_DATE_STR: ${{ steps.downscaled_date.outputs.date }}
          FORECAST_04DEG_DATE_STR: ${{ steps.date_04deg.outputs.date }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRIEFING_TEMPLATE_ID: "1zSp3C35PqDfMKbT8WtEcxoG2EoyIAJA5"

      # ── Convert NetCDF → JSON and update catalog ─────────────────
      - name: Convert NetCDF and update catalog
        working-directory: website_branch
        continue-on-error: true
        env:
          NCDF_DIR:       ncdf_data
          OUTPUT_DIR:     data/weekly
          CATALOG_PATH:   data/weekly/catalog.json
          VARIABLES:      "temp,precip,u10,v10,w500,u700,v700,tcw,cape,d2m,mn2t6,mx2t6"
          N_WEEKS:        "6"
          KEEP_FORECASTS: "5"
        run: |
          python scripts/nc_to_json_and_catalog.py \
            --ncdf-dir    "${{ env.NCDF_DIR }}" \
            --output-dir  "${{ env.OUTPUT_DIR }}" \
            --catalog     "${{ env.CATALOG_PATH }}" \
            --variables   "${{ env.VARIABLES }}" \
            --n-weeks     "${{ env.N_WEEKS }}" \
            --keep        "${{ env.KEEP_FORECASTS }}"

      # ── Upload public plots to the bucket ─────────────────────────
      - name: Upload plots to GCS
        continue-on-error: true
        working-directory: main_repo
        run: |
          if [ -d plots ]; then
            gcloud storage rsync -r plots "gs://${BUCKET}/plots" --exclude='.*index\.md$'
            find plots -type f ! -name "index.md" > ../uploaded_plots.txt
          else
            echo "No plots directory found, skipping."
            > ../uploaded_plots.txt
          fi

      # ── Upload .zarr stores and other data files (e.g. .tif) to the data/ folder ──
      # NetCDF (.nc), GRIB (.grib/.idx), and markdown (.md) files are intermediate/
      # local-only and are always skipped.
      - name: Upload zarr and other data files to GCS
        continue-on-error: true
        working-directory: main_repo
        run: |
          > ../uploaded_data.txt
          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -type d -iname "*.zarr" | while read -r zarr_path; do
              rel_path="${zarr_path#"$OUTPUT_DIR"/}"
              echo "Uploading $zarr_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp -r "$zarr_path" "gs://${BUCKET}/data/${rel_path}"
              # Record ONE line for the whole store, not each internal chunk file —
              # generate_artifact_index.py collapses on ".zarr" to a single folder link.
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done

            # Any other file (e.g. .tif geotiffs) outside the .zarr stores, skipping
            # NetCDF, GRIB, and markdown.
            find "$OUTPUT_DIR" -type d -iname "*.zarr" -prune -o -type f \
              ! -iname "*.nc" ! -iname "*.grib" ! -iname "*.idx" ! -iname "*.md" \
              -print | while read -r file_path; do
              rel_path="${file_path#"$OUTPUT_DIR"/}"
              echo "Uploading $file_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp "$file_path" "gs://${BUCKET}/data/${rel_path}"
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done
            # The MJO indices are the one .nc output published (olr_waves stage).
            find "$OUTPUT_DIR" -type f -name "mjo_*_index_*.nc" | while read -r file_path; do
              rel_path="${file_path#"$OUTPUT_DIR"/}"
              echo "Uploading $file_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp "$file_path" "gs://${BUCKET}/data/${rel_path}"
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done
          else
            echo "No $OUTPUT_DIR directory found, skipping."
          fi

      # ── Generate markdown index for everything just uploaded ─────
      - name: Generate markdown index
        continue-on-error: true
        run: |
          cat uploaded_plots.txt uploaded_data.txt > uploaded_files.txt
          python main_repo/generate_artifact_index.py \
            --bucket "${BUCKET}" \
            --repo-root main_repo \
            --uploaded-list uploaded_files.txt \
            --top-level-file ARTIFACTS.md \
            --top-level-max 30

      # ── Commit only the generated index files to main ────────────
      - name: Commit artifact index to main branch
        continue-on-error: true
        run: |
          cd main_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -A -- '**/index.md' ARTIFACTS.md
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Update artifact index [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin main

      # ── Commit any newly-built model climatology (e.g. m-climate/IO_precip,
      # m-climate/Nino34_sst) so it's cached in the repo instead of being rebuilt
      # from a live reforecast pull on every scheduled run ──────────
      - name: Commit model climatology to main branch
        continue-on-error: true
        run: |
          cd main_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- m-climate
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Update model climatology cache [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin main

      # ── Commit website branch (ncdf data + catalog JSON) ─────────
      - name: Commit website data and catalog
        continue-on-error: true
        run: |
          cd website_branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit on website branch."
          else
            git commit -m "chore: update ncdf data and catalog [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin website
          fi

      - name: Remove website worktree
        run: rm -rf website_branch

      # ── Sheerwater / TAHMO / satellite data ──────────────────────
      - name: Install sheerwater dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements_sheerwater.txt

      - name: Get TAHMO date
        id: tahmo_date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Download TAHMO data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_tahmo_data.py --country Kenya,Ghana,Senegal,Ethiopia --time ${{ steps.tahmo_date.outputs.date }}

      # Lets a same-day Kenya-only run (daily_download2.0_kenya_only.yml) restore
      # this CSV instead of re-downloading every station from the TAHMO API.
      - name: Cache Kenya TAHMO data
        if: hashFiles(format('main_repo/private_data/station_data/Kenya/{0}/*.csv', steps.tahmo_date.outputs.date)) != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: main_repo/private_data/station_data/Kenya/${{ steps.tahmo_date.outputs.date }}
          key: tahmo-Kenya-${{ steps.tahmo_date.outputs.date }}

      - name: Upload files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_data
          path: |
            main_repo/plots/*/*/dekadal/dekadal_precip.png
            main_repo/plots/*/*/weekly/weekly_precip.png
            main_repo/plots/*/*/weekly/weekly_precip_downscaled_clipped.png
            main_repo/plots/*/*/weekly/weekly_precip_downscaled.png
            main_repo/plots/*/*/weekly/weekly_medium_range_precip.png
            main_repo/plots/*/*/weekly/chance_of_above_or_below.png
            main_repo/plots/*/*/04deg/weekly/chance_of_above_or_below.png
            main_repo/plots/briefing/*/kenya_weekly_rainfall_analog_years.png
            main_repo/plots/briefing/*/iod_forecast.png
            main_repo/plots/briefing/*/sst_global_oisst_nino_iod.png
            # main_repo/plots/*/*/dekadal/imerg_*_dekadal.png
            # main_repo/plots/*/*/weekly/imerg_*_weekly.png
            # main_repo/plots/*/*/dekadal/chirps_*_dekadal.png
            # main_repo/plots/*/*/weekly/chirps_*_weekly.png
            main_repo/private_data/**/*.csv
            main_repo/prompts/*.txt
            main_repo/s2s_briefing_*.pptx

  # CHC keeps each 0.4 degree forecast file for only a couple of weeks: keep the
  # global files in the private Sheerwater data lake (licensed ECMWF data, never
  # anywhere public) so later reruns and other regions still have them. They are
  # stored as zarr stores chunked over all lead days (~2.1 GB each), which regional
  # reads fetch concurrently; .nc files archived before the switch are converted too.
  # A job of its own, next to the pipeline rather than in it: a run converts until
  # --budget-minutes is used up (newest first) and leaves the rest for the next run,
  # and a failure here never holds up the plots or the email. The service account
  # needs write access to gs://sheerwater-datalake/ecmwf-0_4/forecast/.
  archive-04deg:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests gcsfs google-auth numpy xarray zarr netCDF4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"

      - name: Archive 0.4 degree forecast files
        run: python forecast_04deg_dates.py archive --budget-minutes 150
        env:
          FORECAST_04DEG_URL: ${{ secrets.FORECAST_04DEG_URL }}

  build-matrix:
    needs: download
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sheet.outputs.matrix }}
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Fetch subscriber sheet via rclone
        id: sheet
        run: |
          pip install openpyxl -q
          rclone copy "gdrive:s2s-emails.xlsx" .
          python3 - <<'EOF'
          import json, os, collections
          import openpyxl

          wb = openpyxl.load_workbook("s2s-emails.xlsx")
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))
          header, *data = rows

          country_emails = collections.defaultdict(set)
          for row in data:
              if not row[1]:
                  continue
              email = str(row[1]).strip()
              for country in str(row[2]).split(","):
                  country = country.strip()
                  if country and email:
                      country_emails[country].add(email)

          KNOWN_COUNTRIES = ["Namibia", "Botswana", "Kenya", "Zambia", "Madagascar", "Angola", "Ghana", "Senegal", "Ethiopia", "Zimbabwe", "Malawi","Great_Horn","Somalia"]
          matrix = [
              {"country": c, "emails": ",".join(sorted(country_emails[c]))}
              for c in KNOWN_COUNTRIES
              if country_emails[c]
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix})}\n")
          EOF

  email:
    needs: [download, build-matrix]
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=${{ needs.download.outputs.run_date }}" >> $GITHUB_OUTPUT

      - name: Get ECMWF lagged date
        id: ecmwf_date
        run: echo "date=${{ needs.download.outputs.ecmwf_date }}" >> $GITHUB_OUTPUT

      - name: Download files as artifact
        uses: actions/download-artifact@v4
        with:
          name: s2s_data

      - name: Check required attachments exist
        id: check_plots
        run: |
          country="${{ matrix.country }}"
          date="${{ steps.ecmwf_date.outputs.date }}"
          briefing_date="${{ steps.date.outputs.date }}"

          if [ "$country" == "Kenya" ]; then
            briefing="s2s_briefing_${briefing_date}.pptx"
            if [ ! -f "$briefing" ] && [ -f "main_repo/$briefing" ]; then
              cp "main_repo/$briefing" "$briefing"
            fi
            if [ -f "$briefing" ]; then
              echo "plots_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "plots_ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Missing weather briefing PowerPoint for Kenya on ${briefing_date} — skipping email."
            fi
          else
            dekadal="plots/${country}/${date}/dekadal/dekadal_precip.png"
            weekly="plots/${country}/${date}/weekly/weekly_precip.png"

            if [ -f "$dekadal" ] && [ -f "$weekly" ]; then
              echo "plots_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "plots_ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Missing required plots for ${country} on ${date} — skipping email. dekadal_precip.png present: $( [ -f "$dekadal" ] && echo yes || echo no ); weekly_precip.png present: $( [ -f "$weekly" ] && echo yes || echo no )"
            fi
          fi

      - name: Build attachment list for ${{ matrix.country }}
        id: attachments
        run: |
          country="${{ matrix.country }}"
          ecmwf_date="${{ steps.ecmwf_date.outputs.date }}"
          today_date="${{ steps.date.outputs.date }}"

          if [ "$country" == "Kenya" ]; then
            analog="plots/briefing/${today_date}/kenya_weekly_rainfall_analog_years.png"
            [ ! -f "$analog" ] && [ -f "main_repo/$analog" ] && analog="main_repo/$analog"

            sst="plots/briefing/${today_date}/sst_global_oisst_nino_iod.png"
            [ ! -f "$sst" ] && [ -f "main_repo/$sst" ] && sst="main_repo/$sst"

            iod="plots/briefing/${today_date}/iod_forecast.png"
            [ ! -f "$iod" ] && [ -f "main_repo/$iod" ] && iod="main_repo/$iod"

            ecmwf_dwn="plots/Kenya/${{ needs.download.outputs.downscaled_date }}/weekly/weekly_precip_downscaled.png"
            [ ! -f "$ecmwf_dwn" ] && [ -f "main_repo/$ecmwf_dwn" ] && ecmwf_dwn="main_repo/$ecmwf_dwn"

            # the 0.4 degree tercile plot when there is one, as in the briefing
            ecmwf_tercile="plots/Kenya/${{ needs.download.outputs.date_04deg }}/04deg/weekly/chance_of_above_or_below.png"
            [ ! -f "$ecmwf_tercile" ] && [ -f "main_repo/$ecmwf_tercile" ] && ecmwf_tercile="main_repo/$ecmwf_tercile"
            if [ ! -f "$ecmwf_tercile" ]; then
              ecmwf_tercile="plots/Kenya/${ecmwf_date}/weekly/chance_of_above_or_below.png"
              [ ! -f "$ecmwf_tercile" ] && [ -f "main_repo/$ecmwf_tercile" ] && ecmwf_tercile="main_repo/$ecmwf_tercile"
            fi

            list="$analog,$sst,$iod,$ecmwf_dwn,$ecmwf_tercile"

            csv="private_data/station_data/${country}/${today_date}/*.csv"
            if ! compgen -G "$csv" > /dev/null; then
              csv="main_repo/private_data/station_data/${country}/${today_date}/*.csv"
            fi
            if compgen -G "$csv" > /dev/null; then
              list="$list,$csv"
            else
              echo "::warning::No TAHMO CSV found for Kenya on ${today_date} — sending email without station data."
            fi

          else
            list="plots/${country}/${ecmwf_date}/dekadal/dekadal_precip.png,"
            list+="plots/${country}/${ecmwf_date}/weekly/weekly_precip.png,"
            list+="plots/${country}/${ecmwf_date}/weekly/weekly_precip_downscaled_clipped.png,"
            list+="plots/${country}/${ecmwf_date}/weekly/weekly_medium_range_precip.png,"
            list+="private_data/station_data/${country}/${today_date}/*.csv"
          fi

          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Checkout publish script
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true'
        uses: actions/checkout@v4
        with:
          path: repo_scripts

      - name: Auth to Google Cloud
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true'
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Install rclone
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true'
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Upload Kenya briefing to Drive and share
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true'
        id: drive
        continue-on-error: true
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          briefing="s2s_briefing_${{ steps.date.outputs.date }}.pptx"
          if [ ! -f "$briefing" ] && [ -f "main_repo/$briefing" ]; then
            briefing="main_repo/$briefing"
          fi
          python -u repo_scripts/publish_briefing_to_drive.py \
            --file "$briefing" \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho" \
            --live \
            --emails "${{ matrix.emails }}"

      - name: Find latest manual analysis deck
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true'
        id: manual_deck
        continue-on-error: true
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          python -u repo_scripts/find_latest_manual_analysis.py \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho"

      # Hold the email back rather than sending recipients "(upload failed)"
      # in place of the deck link; the step after this turns the run red.
      - name: Email Kenya briefing
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true' && steps.drive.outputs.drive_url != ''
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: Daily S2S Outlook
          to: ${{ matrix.emails }}
          from: "${{ matrix.country }} Data Share <info@dashboards.rhizaresearch.org>"
          body: |
            Your Kenya S2S briefing for ${{ steps.ecmwf_date.outputs.date }} is available here:
            ${{ steps.drive.outputs.drive_url }}
            The latest expert analysis deck is available here:
            ${{ steps.manual_deck.outputs.deck_url || '(none found)' }}
            These are shared Google Slide Decks; you are welcome to leave comments.
            You can browse the full plot archive (except station data) at
            https://console.cloud.google.com/storage/browser/africa-forecasting-data .
            Deck highlights are also included as direct attachments: ${{ steps.attachments.outputs.list }}
          reply_to: genevieve@rhizaresearch.org
          attachments: ${{ steps.attachments.outputs.list }}

      - name: Fail if Kenya briefing email was held back
        if: matrix.country == 'Kenya' && steps.check_plots.outputs.plots_ok == 'true' && steps.drive.outputs.drive_url == ''
        run: |
          echo "::error::Kenya briefing Drive upload returned no link (step outcome: ${{ steps.drive.outcome }}); the Kenya email was NOT sent. See the 'Upload Kenya briefing to Drive and share' step log."
          exit 1

      - name: Email out generated plots for ${{ matrix.country }}
        if: matrix.country != 'Kenya' && steps.check_plots.outputs.plots_ok == 'true'
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: Daily S2S Outlook
          to: ${{ matrix.emails }}
          from: "${{ matrix.country }} Data Share <info@dashboards.rhizaresearch.org>"
          body: |
            Attached are dekadal and weekly outlooks and historical station data related
            to the subseasonal forecast. You can also browse the full archive (except for
            the station data) at https://console.cloud.google.com/storage/browser/africa-forecasting-data .
          reply_to: genevieve@rhizaresearch.org
          attachments: ${{ steps.attachments.outputs.list }}
