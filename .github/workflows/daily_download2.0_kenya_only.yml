name: Kenya-only ECMWF Download

# Kenya-scoped rerun of the daily pipeline for a date whose main run failed
# part-way. Before any compute, "Detect completed stages" lists what the main run
# already published to gs://africa-forecasting-data for date_str and turns off
# every stage whose outputs are all there; "Restore completed stages from GCS"
# then pulls those outputs back onto disk, because the staging / upload /
# artifact / email steps at the end of this job read the working tree, not the
# bucket. A stage whose file list is only partly present is re-run, not patched.
# Tick force_all to ignore detection and rebuild everything.
#
# Two stages are deliberately always-on and not detected:
#   - download_s2s.py already resumes by itself (ensure_group_zarr skips a store
#     that is complete locally, else restores it from GCS, else rebuilds it), and
#     later stages plus crop_kenya_zarr.py need the zarr stores on disk anyway.
#   - ai_weather_briefing.py writes the .pptx the email attaches, and neither it
#     nor prompts/digest_*.txt is uploaded to GCS, so there is nothing to detect
#     or restore.
#
# One known gap, harmless (continue-on-error is set throughout, so nothing
# blocks the run):
#   - run_rainfall_onset.py's data/<date>/rainfall_onset_s2s_Kenya.nc is never
#     uploaded either, so a skipped onset stage means ai_weather_briefing.py's
#     add_onset_from_netcdf call fails and the onset write-up is missing from the
#     digest. The .pptx and its restored onset plots are unaffected.

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      date_str:
        description: "date_str"
        required: True
      force_all:
        description: "Rebuild every stage instead of skipping the ones already published for this date"
        type: boolean
        default: false

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      DATA_BRANCH: ${{ github.ref_name }}
      WEBSITE_BRANCH: website
      DATA_DIR: website_data
      OUTPUT_DIR: data
      BUCKET: africa-forecasting-data
      KENYA_BUCKET: kenya-forecasting-data
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
      TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the branch selected in the Actions "Run workflow" dropdown
          # (workflow_dispatch default) so this can be rerun from dev. Do not
          # pin main - that ignored the selected ref and always ran main's code.
          path: main_repo

      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website_branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements.txt

      # ── Authenticate to Google Cloud (Workload Identity Federation) ──
      # Done up front rather than next to the uploads: the detect/restore steps
      # below need gcloud before any compute runs. The upload steps later in the
      # job reuse this same session.
      - name: Auth to Google Cloud
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Setup gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ── Work out which stages the main run already finished ───
      # Every run_* output is consumed as `!= 'false'`, so if this step itself
      # fails (no auth, bucket unreachable) the outputs come back empty and the
      # whole pipeline runs, i.e. exactly the old behaviour.
      - name: Detect completed stages
        id: detect
        continue-on-error: true
        env:
          DATE_STR: ${{ inputs.date_str }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -uo pipefail
          manifest=/tmp/gcs_manifest.txt
          : > "$manifest"
          if [ "$FORCE_ALL" = "true" ]; then
            echo "force_all set - rebuilding every stage."
          else
            for prefix in \
              "plots/Kenya/${DATE_STR}" \
              "plots/diagnostics/${DATE_STR}" \
              "data/${DATE_STR}/gefs"
            do
              gcloud storage ls -r "gs://${BUCKET}/${prefix}/**" >> "$manifest" 2>/dev/null || true
            done
          fi
          echo "Objects already published for ${DATE_STR}: $(wc -l < "$manifest")"

          have()        { grep -qxF "gs://${BUCKET}/$1" "$manifest"; }
          have_prefix() { grep -q  "^gs://${BUCKET}/$1" "$manifest"; }
          # A stage counts as done only when every one of its files is in the
          # bucket; one missing file means the stage is re-run in full.
          complete() {
            local f rc=0
            for f in "$@"; do
              have "$f" || { echo "    missing $f"; rc=1; }
            done
            return $rc
          }

          K="plots/Kenya/${DATE_STR}"
          D="plots/diagnostics/${DATE_STR}"

          gefs_ok=false;  have_prefix "data/${DATE_STR}/gefs/gefs_kenya.zarr/" && gefs_ok=true

          echo "IndianOceanState.py:"
          ios_ok=false
          complete \
            "${D}/monthly/ECMWF_s2s_10wind_sst_anomaly_${DATE_STR}.png" \
            "${D}/weekly/ECMWF_s2s_10wind_sst_anomaly_${DATE_STR}.png" \
            "${D}/weekly/ECMWF_s2s_tcw_anomaly_${DATE_STR}.png" \
            "${D}/monthly/ECMWF_s2s_ivt_u_${DATE_STR}.png" \
            "${D}/weekly/ECMWF_s2s_ivt_u_${DATE_STR}.png" && ios_ok=true

          echo "plot_s2s.py:"
          s2s_ok=false
          complete \
            "${K}/weekly/weekly_precip.png" \
            "${K}/weekly/weekly_change_in_precip.png" \
            "${K}/dekadal/dekadal_precip.png" \
            "${K}/monthly/monthly_precip.png" && s2s_ok=true

          echo "plot_gefs.py:"
          gefsplot_ok=false
          complete \
            "${K}/weekly/gefs_weekly_precip.png" \
            "${K}/dekadal/gefs_dekade_precip.png" \
            "${K}/monthly/gefs_monthly_precip.png" && gefsplot_ok=true

          echo "dowscale_dekade.py:"
          dwn_ok=false
          complete \
            "${K}/weekly/weekly_precip_downscaled.png" \
            "${K}/weekly/weekly_precip_downscaled_clipped.png" \
            "${K}/dekadal/dekadal_precip_downscaled.png" \
            "${K}/dekadal/dekadal_precip_downscaled_clipped.png" \
            "${K}/monthly/monthly_precip_downscaled.png" && dwn_ok=true

          echo "run_rainfall_onset.py:"
          onset_ok=false
          complete \
            "${K}/monthly/onset_s2s.png" \
            "${K}/monthly/onset_gefs.png" \
            "${K}/monthly/onset_s2s_climatology.png" && onset_ok=true

          {
            echo "### Stages detected for ${DATE_STR}"
            echo
            echo "| stage | action |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          emit() {   # emit <output-name> <ok-flag> <label>
            local run="true" action="run"
            if [ "$2" = true ]; then run="false"; action="skip (restore from GCS)"; fi
            echo "$1=$run" >> "$GITHUB_OUTPUT"
            echo "| $3 | $action |" >> "$GITHUB_STEP_SUMMARY"
            echo "$3: $action"
          }
          emit run_gefs_fetch     "$gefs_ok"      "fetch_dynamical.py (GEFS)"
          emit run_indian_ocean   "$ios_ok"       "IndianOceanState.py"
          emit run_plot_s2s       "$s2s_ok"       "plot_s2s.py"
          emit run_plot_gefs      "$gefsplot_ok"  "plot_gefs.py"
          emit run_downscale      "$dwn_ok"       "dowscale_dekade.py"
          emit run_rainfall_onset "$onset_ok"     "run_rainfall_onset.py"

      # ── Put the skipped stages' outputs back on disk ──────────────
      # Restores the whole published plot tree, not just the detected stages, so
      # products this workflow does not regenerate (EFI/SoT, meteograms, t2m, ...)
      # also survive into the staging/upload/email steps. Stages that do re-run
      # overwrite their own files afterwards.
      - name: Restore completed stages from GCS
        if: ${{ !inputs.force_all }}
        continue-on-error: true
        working-directory: main_repo
        env:
          DATE_STR: ${{ inputs.date_str }}
        run: |
          mkdir -p "plots/Kenya/${DATE_STR}" "plots/diagnostics/${DATE_STR}" "data/${DATE_STR}"
          gcloud storage rsync -r "gs://${BUCKET}/plots/Kenya/${DATE_STR}" "plots/Kenya/${DATE_STR}" || true
          gcloud storage rsync -r "gs://${BUCKET}/plots/diagnostics/${DATE_STR}" "plots/diagnostics/${DATE_STR}" || true

          if [ "${{ steps.detect.outputs.run_gefs_fetch }}" = "false" ]; then
            mkdir -p "data/${DATE_STR}/gefs"
            gcloud storage rsync -r "gs://${BUCKET}/data/${DATE_STR}/gefs" "data/${DATE_STR}/gefs" || true
          fi

          # The downscaled .nc/.tif handoffs are excluded from the main bucket but
          # do land in the Kenya bucket, so pull them from there instead - that way
          # "Stage Kenya bucket contents" still re-uploads a complete set when
          # downscaling was skipped.
          if [ "${{ steps.detect.outputs.run_downscale }}" = "false" ]; then
            mkdir -p "data/${DATE_STR}/geotifs_kenya"
            gcloud storage cp "gs://${KENYA_BUCKET}/${DATE_STR}/data/*Kenya*downscaled*.nc" "data/${DATE_STR}/" || true
            gcloud storage cp "gs://${KENYA_BUCKET}/${DATE_STR}/data/daily_downscaled_kenya.tif" "data/${DATE_STR}/" || true
            gcloud storage rsync -r "gs://${KENYA_BUCKET}/${DATE_STR}/data/geotifs_kenya" "data/${DATE_STR}/geotifs_kenya" || true
          fi

      # download_s2s.py is always run: it resumes per-store from GCS by itself,
      # and every later stage needs the zarr data on disk regardless.
      - name: Run download script
        uses: nick-fields/retry@v3
        continue-on-error: true
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: |
            cd main_repo
            python download_s2s.py

      - name: Fetch forecast
        if: ${{ steps.detect.outputs.run_gefs_fetch != 'false' }}
        working-directory: main_repo
        run: |
          uv run fetch_dynamical.py \
            --dataset noaa-gefs-forecast-35-day\
            --date ${{ inputs.date_str }} \
            --countries "Kenya"\
            --variable precipitation_surface \
            --output ./data/${{ inputs.date_str }}/gefs/
        
      - name: Generate Indian Ocean state plot
        if: ${{ steps.detect.outputs.run_indian_ocean != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python IndianOceanState.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      - name: Generate plots
        if: ${{ steps.detect.outputs.run_plot_s2s != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_s2s.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          WEBSITE_PATH: ${{ github.workspace }}/website_branch/
          COUNTRIES: "Kenya"
          AI_ACTIVE: 'True'
          DATE_STR: "${{ inputs.date_str }}"

      - name: Generate GEFS plots
        if: ${{ steps.detect.outputs.run_plot_gefs != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_gefs.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Kenya"
          DATE_STR: "${{ inputs.date_str }}"

      - name: Perform downscaling
        if: ${{ steps.detect.outputs.run_downscale != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python dowscale_dekade.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DEKADE_COUNTRIES: "Kenya"
          WEEK_COUNTRIES: "Kenya"
          DATE_STR: "${{ inputs.date_str }}"

      - name: Install rclone
        continue-on-error: true
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
          
      - name: Run rainfall onset
        if: ${{ steps.detect.outputs.run_rainfall_onset != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: python run_rainfall_onset.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: "${{ inputs.date_str }}"
          COUNTRY: Kenya

      # ── Briefing prerequisites this workflow cannot produce ───────
      # ai_weather_briefing.py is Kenya/Great_Horn-hardcoded, but this workflow
      # runs with COUNTRIES=Kenya and no ws_scripts, so two of its figure trees
      # can never exist locally no matter what inputs are given:
      #   - plots/Great_Horn/.../chance_of_above_or_below.png is a *required*
      #     picture; without it the script exits 1 before prs.save() and no
      #     .pptx is written at all (the step is continue-on-error, so that
      #     failure is silent and the email just goes out with no deck).
      #   - plots/briefing/<date>/*.png are the ws_scripts/skills plots. Missing
      #     ones are tolerated (blank placeholder), so this only improves the
      #     deck rather than unblocking it.
      # Deliberately not gated on force_all, unlike "Restore completed stages
      # from GCS" above: force_all means "regenerate what this workflow can
      # build", and it cannot build either of these.
      - name: Top up briefing prerequisites from GCS
        continue-on-error: true
        working-directory: main_repo
        env:
          DATE_STR: ${{ inputs.date_str }}
        run: |
          for rel in \
            "plots/Great_Horn/${DATE_STR}" \
            "plots/briefing/${DATE_STR}"
          do
            mkdir -p "$rel"
            gcloud storage rsync -r "gs://${BUCKET}/${rel}" "$rel" || true
          done

      - name: Generate AI weather briefing
        continue-on-error: true
        working-directory: main_repo
        run: |
          python ai_weather_briefing.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATE_STR: "${{ inputs.date_str }}"
          BRIEFING_TEMPLATE_ID: "1zSp3C35PqDfMKbT8WtEcxoG2EoyIAJA5"

      # ── Convert NetCDF → JSON and update catalog ─────────────────
      - name: Convert NetCDF and update catalog
        working-directory: website_branch
        continue-on-error: true
        env:
          NCDF_DIR:       ncdf_data
          OUTPUT_DIR:     data/weekly
          CATALOG_PATH:   data/weekly/catalog.json
          VARIABLES:      "temp,precip,u10,v10,w500,u700,v700,tcw,cape,d2m,mn2t6,mx2t6"
          N_WEEKS:        "6"
          KEEP_FORECASTS: "5"
        run: |
          python scripts/nc_to_json_and_catalog.py \
            --ncdf-dir    "${{ env.NCDF_DIR }}" \
            --output-dir  "${{ env.OUTPUT_DIR }}" \
            --catalog     "${{ env.CATALOG_PATH }}" \
            --variables   "${{ env.VARIABLES }}" \
            --n-weeks     "${{ env.N_WEEKS }}" \
            --keep        "${{ env.KEEP_FORECASTS }}"

      # ── Upload public plots to the bucket ─────────────────────────
      - name: Upload plots to GCS
        continue-on-error: true
        working-directory: main_repo
        run: |
          if [ -d plots ]; then
            gcloud storage rsync -r plots "gs://${BUCKET}/plots" --exclude='.*index\.md$'
            find plots -type f ! -name "index.md" > ../uploaded_plots.txt
          else
            echo "No plots directory found, skipping."
            > ../uploaded_plots.txt
          fi

      # ── Upload only .zarr stores to the data/ folder ──────────────
      - name: Upload zarr data to GCS
        continue-on-error: true
        working-directory: main_repo
        run: |
          > ../uploaded_data.txt
          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -type d -iname "*.zarr" | while read -r zarr_path; do
              rel_path="${zarr_path#"$OUTPUT_DIR"/}"
              echo "Uploading $zarr_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp -r "$zarr_path" "gs://${BUCKET}/data/${rel_path}"
              # Record ONE line for the whole store, not each internal chunk file —
              # generate_artifact_index.py collapses on ".zarr" to a single folder link.
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done
          else
            echo "No $OUTPUT_DIR directory found, skipping."
          fi

      # ── Stage Kenya-only plots, downscaled NetCDF, and cropped zarr data ──
      - name: Stage Kenya bucket contents
        continue-on-error: true
        working-directory: main_repo
        run: |
          STAGE_DIR="kenya_bucket_staging/${{ inputs.date_str }}"
          mkdir -p "$STAGE_DIR"
          for sub in weekly dekadal monthly; do
            src="plots/Kenya/${{ inputs.date_str }}/$sub"
            if [ -d "$src" ]; then
              mkdir -p "$STAGE_DIR/$sub"
              cp -r "$src"/. "$STAGE_DIR/$sub/"
            fi
          done
          mkdir -p "$STAGE_DIR/data"
          if [ -d "$OUTPUT_DIR/${{ inputs.date_str }}/gefs" ]; then
            mkdir -p "$STAGE_DIR/data/gefs"
            cp -r "$OUTPUT_DIR/${{ inputs.date_str }}/gefs/gefs_kenya.zarr" "$STAGE_DIR/data/gefs/" 2>/dev/null || true
          fi
          if [ -d "$OUTPUT_DIR/${{ inputs.date_str }}/geotifs_kenya" ]; then
            cp -r "$OUTPUT_DIR/${{ inputs.date_str }}/geotifs_kenya" "$STAGE_DIR/data/"
          fi
          if [ -d "$OUTPUT_DIR/${{ inputs.date_str }}" ]; then
            find "$OUTPUT_DIR/${{ inputs.date_str }}" -maxdepth 1 \
              -type f -iname '*Kenya*downscaled*.nc' \
              -exec cp -v {} "$STAGE_DIR/data/" \;
            find "$OUTPUT_DIR/${{ inputs.date_str }}" -maxdepth 1 \
              -type f -iname 'daily_downscaled_kenya.tif' \
              -exec cp -v {} "$STAGE_DIR/data/" \;
          fi
          python crop_kenya_zarr.py \
            --data-dir "$OUTPUT_DIR/${{ inputs.date_str }}" \
            --output "$STAGE_DIR/data"

      # ── Upload Kenya-only bucket contents ─────────────────────────
      - name: Upload to Kenya bucket
        continue-on-error: true
        working-directory: main_repo
        run: |
          STAGE_DIR="kenya_bucket_staging/${{ inputs.date_str }}"
          if [ -d "$STAGE_DIR" ]; then
            gcloud storage rsync -r "$STAGE_DIR" "gs://${KENYA_BUCKET}/${{ inputs.date_str }}" --exclude='.*index\.md$'
          else
            echo "No Kenya staging directory found, skipping."
          fi

      # ── Generate markdown index for everything just uploaded ─────
      - name: Generate markdown index
        continue-on-error: true
        run: |
          cat uploaded_plots.txt uploaded_data.txt > uploaded_files.txt
          python main_repo/generate_artifact_index.py \
            --bucket "${BUCKET}" \
            --repo-root main_repo \
            --uploaded-list uploaded_files.txt \
            --top-level-file ARTIFACTS.md \
            --top-level-max 30

      # ── Commit only the generated index files, back to the branch this
      # run was dispatched from ─ a rerun from dev updates dev's index, not
      # main's. Pushing to a hardcoded main would fail anyway, since checkout
      # leaves no local main ref when another branch was selected. ────────
      - name: Commit artifact index
        continue-on-error: true
        run: |
          cd main_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -A -- '**/index.md' ARTIFACTS.md
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Update artifact index [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin "HEAD:${DATA_BRANCH}"

      # ── Commit website branch (ncdf data + catalog JSON) ─────────
      - name: Commit website data and catalog
        continue-on-error: true
        run: |
          cd website_branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit on website branch."
          else
            git commit -m "chore: update ncdf data and catalog [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin website
          fi

      - name: Remove website worktree
        run: rm -rf website_branch

      # ── Sheerwater / TAHMO / satellite data ──────────────────────
      - name: Install sheerwater dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements_sheerwater.txt

      - name: Cache nuthatch data
        uses: actions/cache/restore@v4
        with:
          path: main_repo/.nuthatch/caches
          key: nuthatch-

      - name: Download TAHMO data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_tahmo_data.py --country Kenya

      - name: Download IMERG satellite data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_sat_data.py --country Kenya --satellite imerg

      - name: Download CHIRPS satellite data
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_sat_data.py --country Kenya --satellite chirps

      - name: Cache nuthatch data
        uses: actions/cache/save@v4
        with:
          path: main_repo/.nuthatch/caches
          key: nuthatch-${{ github.run_id }}

      - name: Generate satellite vs station plots
        working-directory: main_repo
        continue-on-error: true
        run: |
          yes | python plot_sat_vs_stations.py --country Kenya

      - name: Collect analog-years briefing plot
        continue-on-error: true
        working-directory: main_repo
        run: |
          date="${{ inputs.date_str }}"
          mkdir -p "plots/briefing/${date}"
          mv ws_scripts/kenya_weekly_rainfall_analog_years.png "plots/briefing/${date}/" 2>/dev/null || true
          if [ ! -f "plots/briefing/${date}/kenya_weekly_rainfall_analog_years.png" ]; then
            gcloud storage cp \
              "gs://${BUCKET}/plots/briefing/${date}/kenya_weekly_rainfall_analog_years.png" \
              "plots/briefing/${date}/kenya_weekly_rainfall_analog_years.png" || true
          fi

      - name: Upload files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_data_kenya
          path: |
            main_repo/plots/Kenya/*/dekadal/dekadal_precip.png
            main_repo/plots/Kenya/*/weekly/weekly_precip.png
            main_repo/plots/Kenya/*/weekly/weekly_precip_downscaled_clipped.png
            main_repo/plots/Kenya/*/weekly/weekly_medium_range_precip.png
            main_repo/plots/briefing/*/kenya_weekly_rainfall_analog_years.png
            main_repo/private_plots/**/*.png
            main_repo/private_data/**/*.csv
            main_repo/prompts/*.txt
            main_repo/s2s_briefing_*.pptx

  build-matrix:
    needs: download
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sheet.outputs.matrix }}
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Fetch subscriber sheet via rclone
        id: sheet
        run: |
          pip install openpyxl -q
          rclone copy "gdrive:s2s-emails.xlsx" .
          python3 - <<'EOF'
          import json, os, collections
          import openpyxl

          wb = openpyxl.load_workbook("s2s-emails.xlsx")
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))
          header, *data = rows

          country_emails = collections.defaultdict(set)
          for row in data:
              if not row[1]:
                  continue
              email = str(row[1]).strip()
              for country in str(row[2]).split(","):
                  country = country.strip()
                  if country and email:
                      country_emails[country].add(email)

          KNOWN_COUNTRIES = ["Kenya"]
          matrix = [
              {"country": c, "emails": ",".join(sorted(country_emails[c]))}
              for c in KNOWN_COUNTRIES
              if country_emails[c]
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix})}\n")
          EOF

  email:
    needs: build-matrix
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Download files as artifact
        uses: actions/download-artifact@v4
        with:
          name: s2s_data_kenya

      - name: Check required attachments exist
        id: check_plots
        run: |
          date="${{ inputs.date_str }}"

          briefing="s2s_briefing_${date}.pptx"
          if [ ! -f "$briefing" ] && [ -f "main_repo/$briefing" ]; then
            cp "main_repo/$briefing" "$briefing"
          fi
          if [ -f "$briefing" ]; then
            echo "plots_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "plots_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing weather briefing PowerPoint for Kenya on ${date} — skipping email."
          fi

      - name: Build attachment list for Kenya
        id: attachments
        run: |
          ecmwf_date="${{ inputs.date_str }}"
          today_date="${{ steps.date.outputs.date }}"

          analog="plots/briefing/${ecmwf_date}/kenya_weekly_rainfall_analog_years.png"
          if [ ! -f "$analog" ] && [ -f "main_repo/$analog" ]; then
            analog="main_repo/$analog"
          fi
          list="$analog"

          csv="private_data/station_data/Kenya/${today_date}/*.csv"
          if ! compgen -G "$csv" > /dev/null; then
            csv="main_repo/private_data/station_data/Kenya/${today_date}/*.csv"
          fi
          if compgen -G "$csv" > /dev/null; then
            list="$list,$csv"
          else
            echo "::warning::No TAHMO CSV found for Kenya on ${today_date} — sending email without station data."
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Checkout publish script
        if: steps.check_plots.outputs.plots_ok == 'true'
        uses: actions/checkout@v4
        with:
          path: repo_scripts

      - name: Auth to Google Cloud
        if: steps.check_plots.outputs.plots_ok == 'true'
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Install rclone
        if: steps.check_plots.outputs.plots_ok == 'true'
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Upload Kenya briefing to Drive and share
        if: steps.check_plots.outputs.plots_ok == 'true'
        id: drive
        continue-on-error: true
        run: |
          briefing="s2s_briefing_${{ inputs.date_str }}.pptx"
          if [ ! -f "$briefing" ] && [ -f "main_repo/$briefing" ]; then
            briefing="main_repo/$briefing"
          fi
          python -u repo_scripts/publish_briefing_to_drive.py \
            --file "$briefing" \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho" \
            --live \
            --emails "${{ matrix.emails }}"

      - name: Email out generated plots for Kenya
        if: steps.check_plots.outputs.plots_ok == 'true'
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: Daily S2S Outlook
          to: ${{ matrix.emails }}
          from: "Kenya Data Share <info@dashboards.rhizaresearch.org>"
          body: |
            Today's Kenya S2S briefing is a shared Google Slides deck:
            ${{ steps.drive.outputs.drive_url || '(upload failed)' }}
            Please comment on that deck rather than a local copy.
            You can browse the full plot archive (except station data) at
            https://console.cloud.google.com/storage/browser/africa-forecasting-data .
          reply_to: genevieve@rhizaresearch.org
          attachments: ${{ steps.attachments.outputs.list }}
