name: Kenya-only ECMWF Download

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      date_str:
        description: "Run date YYYY-MM-DD. Blank uses today UTC. The ECMWF model date is two days earlier; if the dynamical.org catalog doesn't have that init yet, this falls back to the CDS/ECDS API for the same date."
        required: false
        default: ""
      force_all:
        description: "Rebuild every stage instead of skipping the ones already published for this date"
        type: boolean
        default: false
      preview_email:
        description: "Send a preview here first; the mailing-list email then waits for approval (kenya-mailing-list environment)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    # The preview job reuses this instead of re-reading the clock, so a run that
    # crosses midnight UTC still looks for the briefing/ws plots it just built.
    outputs:
      briefing_date: ${{ steps.briefing_date.outputs.date }}
      ecmwf_date: ${{ steps.ecmwf_date.outputs.date }}
      date_04deg: ${{ steps.date_04deg.outputs.date }}
      downscaled_date: ${{ steps.downscaled_date.outputs.date }}
    env:
      DATA_BRANCH: ${{ github.ref_name }}
      WEBSITE_BRANCH: website
      DATA_DIR: website_data
      OUTPUT_DIR: data
      BUCKET: africa-forecasting-data
      KENYA_BUCKET: kenya-forecasting-data
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
      TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
      # uvx unpacks forecasting-skills into UV_CACHE_DIR; uv 0.11 then
      # refuses `uv run --script` on those bundled skill scripts unless
      # project discovery is off.
      UV_NO_PROJECT: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the branch selected in the Actions "Run workflow" dropdown
          # (workflow_dispatch default) so this can be rerun from dev. Do not
          # pin main - that ignored the selected ref and always ran main's code.
          path: main_repo

      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: website_branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements.txt

      # ── Authenticate to Google Cloud (Workload Identity Federation) ──
      # Done up front rather than next to the uploads: the detect/restore steps
      # below need gcloud before any compute runs. The upload steps later in the
      # job reuse this same session.
      - name: Auth to Google Cloud
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Setup gcloud
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve run and ECMWF dates
        id: dates
        env:
          RUN_DATE_IN: ${{ inputs.date_str }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          raw = os.environ.get("RUN_DATE_IN", "").strip()
          if raw:
              try:
                  run = datetime.strptime(raw, "%Y-%m-%d").date()
              except ValueError:
                  print(f"::error::Run date must be a real YYYY-MM-DD date (got: {raw})")
                  sys.exit(1)
          else:
              run = datetime.now(timezone.utc).date()
          # Model init lags the run: products for a briefing dated `run`
          # are the ECMWF forecast from two days earlier.
          ecmwf = run - timedelta(days=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run_date={run.isoformat()}\n")
              fh.write(f"ecmwf_date={ecmwf.isoformat()}\n")
          print(f"Run date {run.isoformat()}; ECMWF model date {ecmwf.isoformat()}")
          PY

      # The 0.4 degree forecast for init X is on CHC's server by ~21:05 UTC on
      # day X, so the run usually has the init of the day before: the 0.4
      # degree products (and the Kenya downscaling made from them) are dated by
      # that init, a day newer than the ECMWF date. Falls back to the ECMWF date.
      - name: Resolve 0.4 degree date
        id: date_04deg
        working-directory: main_repo
        run: |
          python forecast_04deg_dates.py resolve \
            --run-date "${{ steps.dates.outputs.run_date }}" \
            --ecmwf-date "${{ steps.dates.outputs.ecmwf_date }}" \
            || echo "date=${{ steps.dates.outputs.ecmwf_date }}" >> "$GITHUB_OUTPUT"
        env:
          FORECAST_04DEG_URL: ${{ secrets.FORECAST_04DEG_URL }}

      # ── Work out which stages the main run already finished ───
      # Every run_* output is consumed as `!= 'false'`, so if this step itself
      # fails (no auth, bucket unreachable) the outputs come back empty and the
      # whole pipeline runs, i.e. exactly the old behaviour.
      - name: Detect completed stages
        id: detect
        continue-on-error: true
        env:
          DATE_STR: ${{ steps.dates.outputs.ecmwf_date }}
          DATE_04DEG: ${{ steps.date_04deg.outputs.date }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -uo pipefail
          manifest=/tmp/gcs_manifest.txt
          : > "$manifest"
          if [ "$FORCE_ALL" = "true" ]; then
            echo "force_all set - rebuilding every stage."
          else
            for prefix in $(printf '%s\n' \
              "plots/Kenya/${DATE_STR}" \
              "plots/Kenya/${DATE_04DEG}" \
              "plots/diagnostics/${DATE_STR}" \
              "data/${DATE_STR}/gefs" | sort -u)
            do
              gcloud storage ls -r "gs://${BUCKET}/${prefix}/**" >> "$manifest" 2>/dev/null || true
            done
          fi
          echo "Objects already published for ${DATE_STR}: $(wc -l < "$manifest")"

          have()        { grep -qxF "gs://${BUCKET}/$1" "$manifest"; }
          have_prefix() { grep -q  "^gs://${BUCKET}/$1" "$manifest"; }
          # A stage counts as done only when every one of its files is in the
          # bucket; one missing file means the stage is re-run in full.
          complete() {
            local f rc=0
            for f in "$@"; do
              have "$f" || { echo "    missing $f"; rc=1; }
            done
            return $rc
          }

          K="plots/Kenya/${DATE_STR}"
          D="plots/diagnostics/${DATE_STR}"
          # the Kenya weekly downscaled forecast and what is made from it are
          # under the 0.4 degree date (the same as DATE_STR when there's no newer one)
          K04="plots/Kenya/${DATE_04DEG}"

          gefs_ok=false;  have_prefix "data/${DATE_STR}/gefs/gefs_kenya.zarr/" && gefs_ok=true

          echo "IndianOceanState.py:"
          ios_ok=false
          complete \
            "${D}/monthly/ECMWF_s2s_10wind_sst_anomaly_${DATE_STR}.png" \
            "${D}/weekly/ECMWF_s2s_10wind_sst_anomaly_${DATE_STR}.png" \
            "${D}/weekly/ECMWF_s2s_tcw_anomaly_${DATE_STR}.png" \
            "${D}/monthly/ECMWF_s2s_ivt_u_${DATE_STR}.png" \
            "${D}/weekly/ECMWF_s2s_ivt_u_${DATE_STR}.png" && ios_ok=true

          echo "plot_s2s.py:"
          s2s_ok=false
          complete \
            "${K}/weekly/weekly_precip.png" \
            "${K}/weekly/weekly_change_in_precip.png" \
            "${K}/dekadal/dekadal_precip.png" \
            "${K}/monthly/monthly_precip.png" && s2s_ok=true

          echo "plot_gefs.py:"
          gefsplot_ok=false
          complete \
            "${K}/weekly/gefs_weekly_precip.png" \
            "${K}/dekadal/gefs_dekade_precip.png" \
            "${K}/monthly/gefs_monthly_precip.png" && gefsplot_ok=true

          echo "dowscale_dekade.py:"
          dwn_ok=false
          complete \
            "${K04}/weekly/weekly_precip_downscaled.png" \
            "${K04}/weekly/weekly_precip_downscaled_clipped.png" \
            "${K}/dekadal/dekadal_precip_downscaled.png" \
            "${K}/dekadal/dekadal_precip_downscaled_clipped.png" \
            "${K04}/monthly/monthly_precip_downscaled.png" && dwn_ok=true

          echo "run_rainfall_onset.py:"
          onset_ok=false
          complete \
            "${K04}/monthly/onset_chirps_observed.png" \
            "${K04}/monthly/onset_downscaled.png" && onset_ok=true

          echo "chirps_agro_climatology.py:"
          chirps_clim_ok=false
          complete \
            "${K04}/monthly/onset_chirps_climatology.png" \
            "${K04}/weekly/median_dryspell_length_chirps_clim.png" && chirps_clim_ok=true

          {
            echo "### Stages detected for ${DATE_STR}"
            echo
            echo "| stage | action |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          emit() {   # emit <output-name> <ok-flag> <label>
            local run="true" action="run"
            if [ "$2" = true ]; then run="false"; action="skip (restore from GCS)"; fi
            echo "$1=$run" >> "$GITHUB_OUTPUT"
            echo "| $3 | $action |" >> "$GITHUB_STEP_SUMMARY"
            echo "$3: $action"
          }
          emit run_gefs_fetch     "$gefs_ok"      "fetch_dynamical.py (GEFS)"
          emit run_indian_ocean   "$ios_ok"       "IndianOceanState.py"
          emit run_plot_s2s       "$s2s_ok"       "plot_s2s.py"
          emit run_plot_gefs      "$gefsplot_ok"  "plot_gefs.py"
          emit run_downscale      "$dwn_ok"       "dowscale_dekade.py"
          emit run_rainfall_onset "$onset_ok"     "run_rainfall_onset.py"
          emit run_chirps_climatology "$chirps_clim_ok" "chirps_agro_climatology.py"

      # ── Put the skipped stages' outputs back on disk ──────────────
      # Restores the whole published plot tree, not just the detected stages, so
      # products this workflow does not regenerate (EFI/SoT, meteograms, t2m, ...)
      # also survive into the staging/upload/email steps. Stages that do re-run
      # overwrite their own files afterwards.
      - name: Restore completed stages from GCS
        if: ${{ !inputs.force_all }}
        continue-on-error: true
        working-directory: main_repo
        env:
          DATE_STR: ${{ steps.dates.outputs.ecmwf_date }}
          DATE_04DEG: ${{ steps.date_04deg.outputs.date }}
        run: |
          mkdir -p "plots/Kenya/${DATE_STR}" "plots/diagnostics/${DATE_STR}" "data/${DATE_STR}"
          gcloud storage rsync -r "gs://${BUCKET}/plots/Kenya/${DATE_STR}" "plots/Kenya/${DATE_STR}" || true
          gcloud storage rsync -r "gs://${BUCKET}/plots/diagnostics/${DATE_STR}" "plots/diagnostics/${DATE_STR}" || true
          if [ "$DATE_04DEG" != "$DATE_STR" ]; then
            mkdir -p "plots/Kenya/${DATE_04DEG}"
            gcloud storage rsync -r "gs://${BUCKET}/plots/Kenya/${DATE_04DEG}" "plots/Kenya/${DATE_04DEG}" || true
          fi

          if [ "${{ steps.detect.outputs.run_gefs_fetch }}" = "false" ]; then
            mkdir -p "data/${DATE_STR}/gefs"
            gcloud storage rsync -r "gs://${BUCKET}/data/${DATE_STR}/gefs" "data/${DATE_STR}/gefs" || true
          fi

          # The downscaled .nc/.tif handoffs are excluded from the main bucket but
          # do land in the Kenya bucket, so pull them from there instead - that way
          # "Stage Kenya bucket contents" still re-uploads a complete set when
          # downscaling was skipped.
          if [ "${{ steps.detect.outputs.run_downscale }}" = "false" ]; then
            mkdir -p "data/${DATE_STR}/geotifs_kenya"
            gcloud storage cp "gs://${KENYA_BUCKET}/${DATE_STR}/data/*Kenya*downscaled*.nc" "data/${DATE_STR}/" || true
            gcloud storage cp "gs://${KENYA_BUCKET}/${DATE_STR}/data/daily_downscaled_kenya.tif" "data/${DATE_STR}/" || true
            gcloud storage rsync -r "gs://${KENYA_BUCKET}/${DATE_STR}/data/geotifs_kenya" "data/${DATE_STR}/geotifs_kenya" || true
            if [ "$DATE_04DEG" != "$DATE_STR" ]; then
              mkdir -p "data/${DATE_04DEG}"
              gcloud storage cp "gs://${KENYA_BUCKET}/${DATE_04DEG}/data/*Kenya*downscaled*.nc" "data/${DATE_04DEG}/" || true
              gcloud storage cp "gs://${KENYA_BUCKET}/${DATE_04DEG}/data/daily_downscaled_kenya.tif" "data/${DATE_04DEG}/" || true
              # the 0.4 degree dekadal GeoTIFFs (downscale_dekade_04deg_.py), on dekad starts
              if gcloud storage ls "gs://${KENYA_BUCKET}/${DATE_04DEG}/data/geotifs_kenya/" >/dev/null 2>&1; then
                mkdir -p "data/${DATE_04DEG}/geotifs_kenya"
                gcloud storage rsync -r "gs://${KENYA_BUCKET}/${DATE_04DEG}/data/geotifs_kenya" "data/${DATE_04DEG}/geotifs_kenya" || true
              fi
            fi
          fi

      # download_s2s.py is always run: it resumes per-store from GCS by itself,
      # and every later stage needs the zarr data on disk regardless.
      - name: Run download script (dynamical.org)
        id: download_primary
        uses: nick-fields/retry@v3
        continue-on-error: true
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
          # Model date, not the run date. Without this, download_s2s.py
          # falls back to today-2 and can miss the resolved ECMWF date.
          DATE_STR: ${{ steps.dates.outputs.ecmwf_date }}
        with:
          timeout_minutes: 45
          max_attempts: 3
          # `|| exit 1` stops bash from exec'ing python directly: a signal
          # death (OOM kill, native crash) then becomes exit 1 instead of a
          # null code, which nick-fields/retry reports as success and which
          # would skip the CDS/ECDS fallback below.
          command: |
            cd main_repo
            python download_s2s.py || exit 1

      # dynamical.org's catalog occasionally lags the CDS/ECDS store it's
      # built from. Same model date, same zarr store names/layout (the
      # dynamical rewrite matched this script's output on purpose), just a
      # different source — so downstream steps don't need to know which one
      # ran. `outcome` (not `conclusion`) reflects the real result even
      # though the step above has continue-on-error: true.
      - name: Run download script (CDS/ECDS fallback)
        id: download_fallback
        if: steps.download_primary.outcome == 'failure'
        uses: nick-fields/retry@v3
        continue-on-error: true
        env:
          BOUNDING_BOX: "22.5,-21,-34.5,55.5"
          DATE_STR: ${{ steps.dates.outputs.ecmwf_date }}
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: |
            cd main_repo
            python download_s2s_legacy.py

      - name: Get briefing date
        id: briefing_date
        run: echo "date=${{ steps.dates.outputs.run_date }}" >> $GITHUB_OUTPUT

      - name: Get ECMWF lagged date
        id: ecmwf_date
        run: echo "date=${{ steps.dates.outputs.ecmwf_date }}" >> $GITHUB_OUTPUT

      - name: Fetch forecast
        if: ${{ steps.detect.outputs.run_gefs_fetch != 'false' }}
        working-directory: main_repo
        run: |
          uv run fetch_dynamical.py             --dataset noaa-gefs-forecast-35-day            --date ${{ steps.ecmwf_date.outputs.date }}             --countries "Kenya"            --variable precipitation_surface             --output ./data/${{ steps.ecmwf_date.outputs.date }}/gefs/

      - name: Generate plots
        if: ${{ steps.detect.outputs.run_plot_s2s != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_s2s.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          WEBSITE_PATH: ${{ github.workspace }}/website_branch/
          COUNTRIES: "Kenya"
          AI_ACTIVE: 'True'
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Generate Indian Ocean state plot
        if: ${{ steps.detect.outputs.run_indian_ocean != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python IndianOceanState.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Generate climate indices timeseries
        continue-on-error: true
        working-directory: main_repo
        run: |
          python climate_indices_timeseries.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Generate GEFS plots
        if: ${{ steps.detect.outputs.run_plot_gefs != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_gefs.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Kenya"
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Perform downscaling
        if: ${{ steps.detect.outputs.run_downscale != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python dowscale_dekade.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DEKADE_COUNTRIES: "Kenya"
          WEEK_COUNTRIES: "Kenya"
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      # ── 0.4 degree precipitation ────────────────────────────────────
      # plot_s2s_04deg_.py downloads the CHC forecast from the address in the
      # FORECAST_04DEG_URL secret. The forecast itself is not public: it is kept
      # as private_data/forecast_04deg/<date>/ECMWF_s2s_precip_04deg_<init>.zarr
      # and its plots as private_plots/<country>/<date>/04deg/, outside data/
      # and plots/, so no step that publishes or emails those picks them up --
      # keep it that way. Only the derived plots (probabilities, EFI/SOT,
      # anomalies, spell lengths: PUBLIC_PLOTS in the script) are copied to
      # plots/<country>/<date>/04deg/ and uploaded with the rest of plots/.
      # downscale_04deg_.py then writes the Kenya weekly downscaled outputs
      # under their normal names -- but only when the forecast for its DATE_STR
      # and a hindcast close to that date are there; otherwise it exits and the
      # 1.5 degree outputs of the step above stay the run's downscaled forecast.
      # Both run on the 0.4 degree date (normally a day newer than the ECMWF
      # date), so their outputs go under that date's folders. The hindcasts are
      # read from the private gs://sheerwater-datalake/ecmwf-0_4 store with the
      # credentials of "Auth to Google Cloud" above, so the service account
      # needs read access to that bucket.
      - name: Generate 0.4 degree precip plots
        if: ${{ steps.detect.outputs.run_downscale != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python plot_s2s_04deg_.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Kenya"
          DATE_STR: ${{ steps.date_04deg.outputs.date }}
          FORECAST_04DEG_URL: ${{ secrets.FORECAST_04DEG_URL }}

      - name: Perform 0.4 degree downscaling
        if: ${{ steps.detect.outputs.run_downscale != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python downscale_04deg_.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.date_04deg.outputs.date }}
          # the 1.5 degree run whose days extend the rainfall onset forecast
          ONSET_1P5_DATE: ${{ steps.ecmwf_date.outputs.date }}

      # downscale_dekade_04deg_.py: the dekadal counterpart of the step above, on
      # dekad starts only (gef.DEKAD_FORECAST_FILES). Replaces dowscale_dekade.py's
      # 1.5 degree dekadal outputs of the same names when the 0.4 degree forecast for
      # its date and the hindcast store are there; otherwise exits and leaves them.
      - name: Perform 0.4 degree dekadal downscaling
        if: ${{ steps.detect.outputs.run_downscale != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python downscale_dekade_04deg_.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DEKADE_COUNTRIES: "Kenya"
          DATE_STR: ${{ steps.date_04deg.outputs.date }}

      # The run for the day before made the 0.4 degree Kenya downscaling for
      # this ECMWF date; dowscale_dekade.py's 1.5 degree outputs of the same
      # names must not replace it in the buckets. Restores it locally if this
      # run's 0.4 degree downscaling didn't run.
      - name: Keep published 0.4 degree downscaling
        if: ${{ steps.detect.outputs.run_downscale != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python forecast_04deg_dates.py keep-published \
            --date "${{ steps.ecmwf_date.outputs.date }}" \
            --date-04deg "${{ steps.date_04deg.outputs.date }}"
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/

      # The date the run's Kenya weekly downscaled forecast is under: the 0.4
      # degree date when that downscaling ran (or was restored), else the ECMWF
      # date. Everything made from it below (onset, CHIRPS climatology maps,
      # ws_scripts, briefing) uses this date.
      - name: Resolve downscaled forecast date
        id: downscaled_date
        working-directory: main_repo
        run: |
          d04="${{ steps.date_04deg.outputs.date }}"
          if [ -n "$d04" ] && [ -f "data/$d04/data_weekly_Kenya_downscaled.nc" ]; then
            d="$d04"
          else
            d="${{ steps.ecmwf_date.outputs.date }}"
          fi
          echo "Downscaled forecast date: $d"
          echo "date=$d" >> "$GITHUB_OUTPUT"

      # ── OLR tropical waves + MJO OLR/RMM indices ─────────────────────
      # Needs the ERA5 archive (daily OLR 2006-now, 15S-15N u850/u200, BoM's
      # RMM file) kept in gs://${BUCKET}/era5/: pull it, top it up to the
      # latest ERA5T day from ARCO (only the missing days), push the changed
      # files back (appending ERA5 days is date-independent and idempotent).
      # Then the six scripts in order, on the ECMWF date; their forecast and
      # reforecast come from dynamical.org and Planette, not from the download
      # above. Only plots/olr_waves/<date>/ and data/<date>/mjo_*_index_<date>.nc
      # are published: the ~340 MB of intermediate zarrs are removed.
      - name: Pull ERA5 archive from GCS
        id: era5_pull
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p olr_obs
          gcloud storage rsync -r "gs://${BUCKET}/era5" olr_obs

      - name: Top up ERA5 archive
        if: ${{ steps.era5_pull.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          python olr_obs_archive.py
          python rmm_wind_archive.py

      # always(): a partly topped-up archive is still worth saving (each
      # yearly file is written atomically); no deletes, so nothing is lost
      - name: Push ERA5 archive to GCS
        if: ${{ always() && steps.era5_pull.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          gcloud storage rsync -r olr_obs "gs://${BUCKET}/era5"

      - name: Download OLR for the wave filtering
        id: olr_download
        continue-on-error: true
        working-directory: main_repo
        run: python download_olr_waves.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: OLR wave anomalies
        id: olr_anom
        if: ${{ steps.olr_download.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python olr_wave_anomalies.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: OLR wave filtering
        id: olr_filter
        if: ${{ steps.olr_anom.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python olr_wave_filter.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      # Rainfall anomaly maps over East Africa / the western Indian Ocean with
      # the MJO (weekly) and Kelvin (daily) filtered OLR contoured on top.
      # Needs olr_waves_<date>.zarr, so it runs before the intermediates go.
      - name: Rainfall anomaly maps with wave OLR
        if: ${{ steps.olr_filter.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python olr_wave_rain_maps.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Download winds for the RMM index
        id: rmm_download
        if: ${{ steps.olr_anom.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python download_rmm_winds.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: MJO RMM index
        if: ${{ steps.rmm_download.outcome == 'success' }}
        continue-on-error: true
        working-directory: main_repo
        run: python mjo_rmm_index.py
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      # keep the intermediates out of the zarr upload below
      - name: Remove OLR wave intermediates
        if: ${{ always() }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          for s in ECMWF_s2s_olr ECMWF_s2s_olr_reforecast olr_anom olr_obs_leadin olr_waves; do
            rm -rf "data/$DATE_STR/${s}_$DATE_STR.zarr"
          done
          rm -f data/$DATE_STR/rmm_u_*_$DATE_STR.nc
        env:
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}

      - name: Run rainfall onset
        if: ${{ steps.detect.outputs.run_rainfall_onset != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          IFS=',' read -ra countries <<< "$COUNTRIES"
          for country in "${countries[@]}"; do
            echo "Rainfall onset: $country"
            COUNTRY="$country" python run_rainfall_onset.py || true
          done
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          COUNTRIES: "Kenya"
          DATE_STR: ${{ steps.downscaled_date.outputs.date }}

      # CHIRPS climatology counterparts of the downscaled onset/spell maps
      # (the briefing's "_clim" pictures, Kenya-only). Only the small derived
      # results are cached (chirps_clim_cache/: per calendar week and per
      # season), in the Actions cache since this workflow can't commit to main --
      # a cache key can't be overwritten, so restore the newest one by prefix and
      # save under a hash of the contents, which only adds an entry when this run
      # added a week or season.
      - name: Restore CHIRPS climatology cache
        if: ${{ steps.detect.outputs.run_chirps_climatology != 'false' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: main_repo/chirps_clim_cache
          key: chirps-clim-Kenya-${{ github.run_id }}
          restore-keys: chirps-clim-Kenya-

      - name: Run CHIRPS climatology
        if: ${{ steps.detect.outputs.run_chirps_climatology != 'false' }}
        continue-on-error: true
        working-directory: main_repo
        run: |
          COUNTRY=Kenya python chirps_agro_climatology.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.downscaled_date.outputs.date }}

      - name: Save CHIRPS climatology cache
        if: ${{ steps.detect.outputs.run_chirps_climatology != 'false' && hashFiles('main_repo/chirps_clim_cache/**/*.nc') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: main_repo/chirps_clim_cache
          key: chirps-clim-Kenya-${{ hashFiles('main_repo/chirps_clim_cache/**/*.nc') }}

      - name: Replot precip with shared color scale
        continue-on-error: true
        working-directory: main_repo
        run: |
          python replot_precip_shared_colorscale.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}
          DOWNSCALED_DATE_STR: ${{ steps.downscaled_date.outputs.date }}

      # Great_Horn is fetched because ai_weather_briefing.py is
      # Kenya/Great_Horn-hardcoded while this workflow runs COUNTRIES=Kenya, so
      # plots/Great_Horn/.../chance_of_above_or_below.png can never exist
      # locally. It's an optional picture (a missing one leaves a blank slot
      # rather than blocking the deck), so this only keeps it in the briefing
      # when the main run has published it. Not gated on force_all: force_all
      # means "regenerate what this workflow can build", and it cannot build this.
      - name: Top up briefing prerequisites from GCS
        continue-on-error: true
        working-directory: main_repo
        env:
          # ws_scripts/skills plots are keyed to the current date; every other
          # tree is keyed to the -2 day forecast date. Same split the briefing
          # step below is given.
          DATE_STR: ${{ steps.ecmwf_date.outputs.date }}
          BRIEFING_DATE: ${{ steps.briefing_date.outputs.date }}
        run: |
          mkdir -p "plots/Great_Horn/${DATE_STR}" "plots/briefing/${BRIEFING_DATE}"
          gcloud storage rsync -r "gs://${BUCKET}/plots/Great_Horn/${DATE_STR}" "plots/Great_Horn/${DATE_STR}" || true
          gcloud storage rsync -r "gs://${BUCKET}/plots/briefing/${BRIEFING_DATE}" "plots/briefing/${BRIEFING_DATE}" || true

      # Publish the Kenya bucket before the ws_scripts: seasonal_progression_vs_analog_years.sh
      # and kenya_daily_downscaled_precip.sh read today's downscaled forecast back from
      # gs://${KENYA_BUCKET}, and uploading afterwards made them silently use the previous init.
      # ── Stage Kenya-only plots, downscaled NetCDF, and cropped zarr data ──
      # For the ECMWF date and, when they differ, the downscaled forecast's date
      # and the 0.4 degree date (its dekadal product is there even when the weekly
      # one fell back to the ECMWF date).
      - name: Stage Kenya bucket contents
        continue-on-error: true
        working-directory: main_repo
        run: |
          for d in $(printf '%s\n' "${{ steps.ecmwf_date.outputs.date }}" "${{ steps.downscaled_date.outputs.date }}" "${{ steps.date_04deg.outputs.date }}" | grep . | sort -u); do
            STAGE_DIR="kenya_bucket_staging/$d"
            mkdir -p "$STAGE_DIR"
            for sub in weekly dekadal monthly 04deg; do
              src="plots/Kenya/$d/$sub"
              if [ -d "$src" ]; then
                mkdir -p "$STAGE_DIR/$sub"
                cp -r "$src"/. "$STAGE_DIR/$sub/"
              fi
            done
            mkdir -p "$STAGE_DIR/data"
            if [ -d "$OUTPUT_DIR/$d/gefs" ]; then
              mkdir -p "$STAGE_DIR/data/gefs"
              cp -r "$OUTPUT_DIR/$d/gefs/gefs_kenya.zarr" "$STAGE_DIR/data/gefs/" 2>/dev/null || true
            fi
            if [ -d "$OUTPUT_DIR/$d/geotifs_kenya" ]; then
              cp -r "$OUTPUT_DIR/$d/geotifs_kenya" "$STAGE_DIR/data/"
            fi
            if [ -d "$OUTPUT_DIR/$d" ]; then
              find "$OUTPUT_DIR/$d" -maxdepth 1 \
                -type f -iname '*Kenya*downscaled*.nc' \
                -exec cp -v {} "$STAGE_DIR/data/" \;
              find "$OUTPUT_DIR/$d" -maxdepth 1 \
                -type f -iname 'daily_downscaled_kenya.tif' \
                -exec cp -v {} "$STAGE_DIR/data/" \;
            fi
            python crop_kenya_zarr.py \
              --data-dir "$OUTPUT_DIR/$d" \
              --output "$STAGE_DIR/data" || echo "::warning::crop_kenya_zarr.py failed for $d"
          done

      # ── Upload Kenya-only bucket contents ─────────────────────────
      - name: Upload to Kenya bucket
        continue-on-error: true
        working-directory: main_repo
        run: |
          found=false
          for STAGE_DIR in kenya_bucket_staging/*/; do
            [ -d "$STAGE_DIR" ] || continue
            found=true
            d=$(basename "$STAGE_DIR")
            gcloud storage rsync -r "$STAGE_DIR" "gs://${KENYA_BUCKET}/$d" --exclude='.*index\.md$'
          done
          $found || echo "No Kenya staging directory found, skipping."

      # ── Weather-skills briefing plots (ws_scripts/*.sh) ──────
      - name: Install uv for ws_scripts
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"

      # Same skip-if-already-published idea as "Detect completed stages" above,
      # but per ws_script rather than per pipeline stage, and against the plots
      # the rsync just restored. A script re-runs if *any* figure it writes is
      # missing: they are cheap to redo relative to a blank slide, and several
      # scripts emit a whole family from one pipeline (last_weeks_forecast_
      # verification writes 12, one per model x metric). Only figures the deck
      # actually places are gated on -- a script's other outputs (e.g.
      # kenya_{aifs,gefs}_prob_above.png) are not in briefing_plot_names and are
      # not published, so gating on them would re-run the script every time.
      - name: Detect existing briefing plots
        id: ws
        working-directory: main_repo
        env:
          BRIEFING_DATE: ${{ steps.briefing_date.outputs.date }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          dir="plots/briefing/${BRIEFING_DATE}"
          check() {
            name="$1"; shift
            if [ "$FORCE_ALL" = "true" ]; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              echo "run  ${name} (force_all)"
              return
            fi
            missing=""
            for f in "$@"; do
              [ -s "$dir/$f" ] || missing="${missing} ${f}"
            done
            if [ -n "$missing" ]; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              echo "run  ${name} -- missing:${missing}"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
              echo "skip ${name} (all figures restored)"
            fi
          }
          check recent_rainfall_observations_kenya chirps_kenya_weekly_rainfall.png chirps_kenya_weekly_anomaly.png
          check recent_rainfall_observations_eastern_africa chirps_east_africa_weekly_rainfall.png chirps_east_africa_weekly_anomaly.png
          check recent_observations_station_data tahmo_kenya_cities_rainfall.png tahmo_kenya_cities_temperature.png tahmo_kenya_cities_humidity.png
          check seasonal_progression kenya_ond_last_week_rainfall_kenya_extent.png kenya_ond_weekly_rainfall_vs_climatology.png kenya_ond_weekly_standardized_anomaly.png
          check seasonal_progression_vs_analog_years kenya_weekly_rainfall_analog_years.png
          check equatorial_waves_mjo mjo_rmm_ecmwf.png mjo_rmm_gefs.png
          check equatorial_waves_iod_enso enso_forecast.png enso_observed.png iod_forecast.png iod_observed.png
          check itcz_state itcz_africa_latest.png
          check equatorial_waves_analyses_and_forecasts hovmoller_olr_tropics.png olr_map_africa.png
          check current_sst_conditions sst_global_oisst_nino_iod.png
          check last_weeks_forecast_verification kenya_gefs_chirps_verify_5mm.png kenya_gefs_chirps_bias.png kenya_gefs_chirps_mae.png kenya_aifs_chirps_verify_5mm.png kenya_aifs_chirps_bias.png kenya_aifs_chirps_mae.png kenya_ecmwf_chirps_verify_5mm.png kenya_ecmwf_chirps_bias.png kenya_ecmwf_chirps_mae.png kenya_kmsa_chirps_verify_5mm.png kenya_kmsa_chirps_bias.png kenya_kmsa_chirps_mae.png
          check week1_mae_vs_chirps kenya_week1_mae_vs_chirps_4wk.png
          check kenya_daily_downscaled_precip kenya_daily_downscaled_precip.png kenya_daily_downscaled_precip_anomaly.png kenya_aifs_daily_precip.png kenya_aifs_daily_precip_anomaly.png kenya_gefs_daily_precip.png kenya_gefs_daily_precip_anomaly.png
      - name: Run recent_rainfall_observations_kenya.sh
        if: ${{ steps.ws.outputs.recent_rainfall_observations_kenya == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_rainfall_observations_kenya.sh

      - name: Run recent_rainfall_observations_eastern_africa.sh
        if: ${{ steps.ws.outputs.recent_rainfall_observations_eastern_africa == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_rainfall_observations_eastern_africa.sh

      - name: Run recent_observations_station_data.sh
        if: ${{ steps.ws.outputs.recent_observations_station_data == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash recent_observations_station_data.sh

      - name: Run seasonal_progression.sh
        if: ${{ steps.ws.outputs.seasonal_progression == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash seasonal_progression.sh

      - name: Run seasonal_progression_vs_analog_years.sh
        if: ${{ steps.ws.outputs.seasonal_progression_vs_analog_years == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        env:
          INIT_OVERRIDE: ${{ steps.downscaled_date.outputs.date }}
          ECMWF_DATASTORES_URL: "https://ecds.ecmwf.int/api"
          ECMWF_DATASTORES_KEY: ${{ secrets.CDSAPI_KEY }}
        run: bash seasonal_progression_vs_analog_years.sh

      - name: Run equatorial_waves_mjo.sh
        if: ${{ steps.ws.outputs.equatorial_waves_mjo == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_mjo.sh

      - name: Run equatorial_waves_iod_enso.sh
        if: ${{ steps.ws.outputs.equatorial_waves_iod_enso == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_iod_enso.sh

      - name: Run itcz_state.sh
        if: ${{ steps.ws.outputs.itcz_state == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash itcz_state.sh

      - name: Run equatorial_waves_analyses_and_forecasts.sh
        if: ${{ steps.ws.outputs.equatorial_waves_analyses_and_forecasts == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash equatorial_waves_analyses_and_forecasts.sh

      - name: Run current_sst_conditions.sh
        if: ${{ steps.ws.outputs.current_sst_conditions == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash current_sst_conditions.sh

      - name: Run last_weeks_forecast_verification.sh
        if: ${{ steps.ws.outputs.last_weeks_forecast_verification == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash last_weeks_forecast_verification.sh

      - name: Run week1_mae_vs_chirps.sh
        if: ${{ steps.ws.outputs.week1_mae_vs_chirps == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        run: bash week1_mae_vs_chirps.sh

      - name: Run kenya_daily_downscaled_precip.sh
        if: ${{ steps.ws.outputs.kenya_daily_downscaled_precip == 'true' }}
        continue-on-error: true
        working-directory: main_repo/ws_scripts
        env:
          INIT_OVERRIDE: ${{ steps.downscaled_date.outputs.date }}
        run: bash kenya_daily_downscaled_precip.sh

      - name: Collect briefing plots
        continue-on-error: true
        working-directory: main_repo
        run: |
          mkdir -p "plots/briefing/${{ steps.briefing_date.outputs.date }}"
          mv ws_scripts/*.png "plots/briefing/${{ steps.briefing_date.outputs.date }}/" 2>/dev/null || true

      - name: Install rclone
        continue-on-error: true
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        continue-on-error: true
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Generate AI weather briefing
        continue-on-error: true
        working-directory: main_repo
        run: |
          python ai_weather_briefing.py
        env:
          MAIN_PATH: ${{ github.workspace }}/main_repo/
          DATE_STR: ${{ steps.briefing_date.outputs.date }}
          ECMWF_DATE_STR: ${{ steps.ecmwf_date.outputs.date }}
          DOWNSCALED_DATE_STR: ${{ steps.downscaled_date.outputs.date }}
          FORECAST_04DEG_DATE_STR: ${{ steps.date_04deg.outputs.date }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRIEFING_TEMPLATE_ID: "1zSp3C35PqDfMKbT8WtEcxoG2EoyIAJA5"

      # ── Convert NetCDF → JSON and update catalog ─────────────────
      - name: Convert NetCDF and update catalog
        working-directory: website_branch
        continue-on-error: true
        env:
          NCDF_DIR:       ncdf_data
          OUTPUT_DIR:     data/weekly
          CATALOG_PATH:   data/weekly/catalog.json
          VARIABLES:      "temp,precip,u10,v10,w500,u700,v700,tcw,cape,d2m,mn2t6,mx2t6"
          N_WEEKS:        "6"
          KEEP_FORECASTS: "5"
        run: |
          python scripts/nc_to_json_and_catalog.py \
            --ncdf-dir    "${{ env.NCDF_DIR }}" \
            --output-dir  "${{ env.OUTPUT_DIR }}" \
            --catalog     "${{ env.CATALOG_PATH }}" \
            --variables   "${{ env.VARIABLES }}" \
            --n-weeks     "${{ env.N_WEEKS }}" \
            --keep        "${{ env.KEEP_FORECASTS }}"

      # ── Upload public plots to the bucket ─────────────────────────
      - name: Upload plots to GCS
        continue-on-error: true
        working-directory: main_repo
        run: |
          if [ -d plots ]; then
            gcloud storage rsync -r plots "gs://${BUCKET}/plots" --exclude='.*index\.md$'
            find plots -type f ! -name "index.md" > ../uploaded_plots.txt
          else
            echo "No plots directory found, skipping."
            > ../uploaded_plots.txt
          fi

      # ── Upload only .zarr stores to the data/ folder ──────────────
      - name: Upload zarr and other data files to GCS
        continue-on-error: true
        working-directory: main_repo
        run: |
          > ../uploaded_data.txt
          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -type d -iname "*.zarr" | while read -r zarr_path; do
              rel_path="${zarr_path#"$OUTPUT_DIR"/}"
              echo "Uploading $zarr_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp -r "$zarr_path" "gs://${BUCKET}/data/${rel_path}"
              # Record ONE line for the whole store, not each internal chunk file —
              # generate_artifact_index.py collapses on ".zarr" to a single folder link.
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done

            # Any other file (e.g. .tif geotiffs) outside the .zarr stores, skipping
            # NetCDF, GRIB, and markdown.
            find "$OUTPUT_DIR" -type d -iname "*.zarr" -prune -o -type f               ! -iname "*.nc" ! -iname "*.grib" ! -iname "*.idx" ! -iname "*.md"               -print | while read -r file_path; do
              rel_path="${file_path#"$OUTPUT_DIR"/}"
              echo "Uploading $file_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp "$file_path" "gs://${BUCKET}/data/${rel_path}"
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done
            # The MJO indices are the one .nc output published (olr_waves stage).
            find "$OUTPUT_DIR" -type f -name "mjo_*_index_*.nc" | while read -r file_path; do
              rel_path="${file_path#"$OUTPUT_DIR"/}"
              echo "Uploading $file_path -> gs://${BUCKET}/data/${rel_path}"
              gcloud storage cp "$file_path" "gs://${BUCKET}/data/${rel_path}"
              echo "data/${rel_path}" >> ../uploaded_data.txt
            done
          else
            echo "No $OUTPUT_DIR directory found, skipping."
          fi

      # ── Generate markdown index for everything just uploaded ─────
      - name: Generate markdown index
        continue-on-error: true
        run: |
          cat uploaded_plots.txt uploaded_data.txt > uploaded_files.txt
          python main_repo/generate_artifact_index.py \
            --bucket "${BUCKET}" \
            --repo-root main_repo \
            --uploaded-list uploaded_files.txt \
            --top-level-file ARTIFACTS.md \
            --top-level-max 30

      # ── Commit only the generated index files to DATA_BRANCH ─────
      - name: Commit artifact index
        continue-on-error: true
        run: |
          cd main_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -A -- '**/index.md' ARTIFACTS.md
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Update artifact index [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin "HEAD:${DATA_BRANCH}"

      - name: Commit model climatology
        continue-on-error: true
        run: |
          cd main_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- m-climate
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Update model climatology cache [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push origin "HEAD:${DATA_BRANCH}"

      # ── Commit website branch (ncdf data + catalog JSON) ─────────
      - name: Commit website data and catalog
        continue-on-error: true
        run: |
          cd website_branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit on website branch."
          else
            git commit -m "chore: update ncdf data and catalog [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin website
          fi

      - name: Remove website worktree
        run: rm -rf website_branch

      # ── Sheerwater / TAHMO / satellite data ──────────────────────
      - name: Install sheerwater dependencies
        working-directory: main_repo
        run: |
          pip install -r requirements_sheerwater.txt

      # Reuse today's Kenya TAHMO CSV if the daily run (on main) or an earlier
      # run on this branch already downloaded it. get_tahmo_data.py's window
      # ends on the run day, so only a same-day entry is valid (exact key).
      - name: Restore Kenya TAHMO data
        id: tahmo_cache
        if: ${{ !inputs.force_all }}
        uses: actions/cache/restore@v4
        with:
          path: main_repo/private_data/station_data/Kenya/${{ steps.briefing_date.outputs.date }}
          key: tahmo-Kenya-${{ steps.briefing_date.outputs.date }}

      - name: Download TAHMO data
        if: steps.tahmo_cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 60
          max_attempts: 2
          command: |
            cd main_repo
            yes | python get_tahmo_data.py --country Kenya --time ${{ steps.briefing_date.outputs.date }}

      - name: Cache Kenya TAHMO data
        if: steps.tahmo_cache.outputs.cache-hit != 'true' && hashFiles(format('main_repo/private_data/station_data/Kenya/{0}/*.csv', steps.briefing_date.outputs.date)) != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: main_repo/private_data/station_data/Kenya/${{ steps.briefing_date.outputs.date }}
          key: tahmo-Kenya-${{ steps.briefing_date.outputs.date }}

      - name: Upload files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2s_data_kenya
          path: |
            main_repo/plots/Kenya/*/dekadal/dekadal_precip.png
            main_repo/plots/Kenya/*/weekly/weekly_precip.png
            main_repo/plots/Kenya/*/weekly/weekly_precip_downscaled_clipped.png
            main_repo/plots/Kenya/*/weekly/weekly_precip_downscaled.png
            main_repo/plots/Kenya/*/weekly/chance_of_above_or_below.png
            main_repo/plots/Kenya/*/04deg/weekly/chance_of_above_or_below.png
            main_repo/plots/Kenya/*/weekly/weekly_medium_range_precip.png
            main_repo/plots/briefing/**/*.png
            main_repo/private_data/**/*.csv
            main_repo/prompts/*.txt
            main_repo/s2s_briefing_*.pptx

  build-matrix:
    needs: download
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sheet.outputs.matrix }}
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Fetch subscriber sheet via rclone
        id: sheet
        run: |
          pip install openpyxl -q
          rclone copy "gdrive:s2s-emails.xlsx" .
          python3 - <<'EOF'
          import json, os, collections
          import openpyxl

          wb = openpyxl.load_workbook("s2s-emails.xlsx")
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))
          header, *data = rows

          country_emails = collections.defaultdict(set)
          for row in data:
              if not row[1]:
                  continue
              email = str(row[1]).strip()
              for country in str(row[2]).split(","):
                  country = country.strip()
                  if country and email:
                      country_emails[country].add(email)

          KNOWN_COUNTRIES = ["Kenya"]
          matrix = [
              {"country": c, "emails": ",".join(sorted(country_emails[c]))}
              for c in KNOWN_COUNTRIES
              if country_emails[c]
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix})}\n")
          EOF

  # Builds the Kenya email once and sends it only to inputs.preview_email. The
  # Drive deck it uploads is the one the mailing list later gets shared, and its
  # attachment list / deck links are handed to the `email` job below.
  preview:
    needs: download
    runs-on: ubuntu-latest
    outputs:
      plots_ok: ${{ steps.check_plots.outputs.plots_ok }}
      briefing: ${{ steps.check_plots.outputs.briefing }}
      attachments: ${{ steps.attachments.outputs.list }}
      drive_file_id: ${{ steps.drive.outputs.drive_file_id }}
      drive_url: ${{ steps.drive.outputs.drive_url }}
      deck_url: ${{ steps.manual_deck.outputs.deck_url }}
    steps:
      - name: Get briefing date
        id: date
        run: echo "date=${{ needs.download.outputs.briefing_date }}" >> $GITHUB_OUTPUT

      - name: Get ECMWF lagged date
        id: ecmwf_date
        run: echo "date=${{ needs.download.outputs.ecmwf_date }}" >> $GITHUB_OUTPUT

      - name: Download files as artifact
        uses: actions/download-artifact@v4
        with:
          name: s2s_data_kenya

      - name: Check required attachments exist
        id: check_plots
        run: |
          briefing_date="${{ steps.date.outputs.date }}"

          briefing="s2s_briefing_${briefing_date}.pptx"
          if [ ! -f "$briefing" ] && [ -f "main_repo/$briefing" ]; then
            briefing="main_repo/$briefing"
          fi
          if [ -f "$briefing" ]; then
            echo "plots_ok=true" >> "$GITHUB_OUTPUT"
            echo "briefing=$briefing" >> "$GITHUB_OUTPUT"
          else
            echo "plots_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing weather briefing PowerPoint for Kenya on ${briefing_date} — skipping email."
          fi

      - name: Build attachment list for Kenya
        id: attachments
        run: |
          ecmwf_date="${{ steps.ecmwf_date.outputs.date }}"
          today_date="${{ steps.date.outputs.date }}"

          analog="plots/briefing/${today_date}/kenya_weekly_rainfall_analog_years.png"
          [ ! -f "$analog" ] && [ -f "main_repo/$analog" ] && analog="main_repo/$analog"

          sst="plots/briefing/${today_date}/sst_global_oisst_nino_iod.png"
          [ ! -f "$sst" ] && [ -f "main_repo/$sst" ] && sst="main_repo/$sst"

          iod="plots/briefing/${today_date}/iod_forecast.png"
          [ ! -f "$iod" ] && [ -f "main_repo/$iod" ] && iod="main_repo/$iod"

          ecmwf_dwn="plots/Kenya/${{ needs.download.outputs.downscaled_date }}/weekly/weekly_precip_downscaled.png"
          [ ! -f "$ecmwf_dwn" ] && [ -f "main_repo/$ecmwf_dwn" ] && ecmwf_dwn="main_repo/$ecmwf_dwn"

          # the 0.4 degree tercile plot when there is one, as in the briefing
          ecmwf_tercile="plots/Kenya/${{ needs.download.outputs.date_04deg }}/04deg/weekly/chance_of_above_or_below.png"
          [ ! -f "$ecmwf_tercile" ] && [ -f "main_repo/$ecmwf_tercile" ] && ecmwf_tercile="main_repo/$ecmwf_tercile"
          if [ ! -f "$ecmwf_tercile" ]; then
            ecmwf_tercile="plots/Kenya/${ecmwf_date}/weekly/chance_of_above_or_below.png"
            [ ! -f "$ecmwf_tercile" ] && [ -f "main_repo/$ecmwf_tercile" ] && ecmwf_tercile="main_repo/$ecmwf_tercile"
          fi

          list="$analog,$sst,$iod,$ecmwf_dwn,$ecmwf_tercile"

          csv="private_data/station_data/Kenya/${today_date}/*.csv"
          if ! compgen -G "$csv" > /dev/null; then
            csv="main_repo/private_data/station_data/Kenya/${today_date}/*.csv"
          fi
          if compgen -G "$csv" > /dev/null; then
            list="$list,$csv"
          else
            echo "::warning::No TAHMO CSV found for Kenya on ${today_date} — sending email without station data."
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Checkout publish script
        if: steps.check_plots.outputs.plots_ok == 'true'
        uses: actions/checkout@v4
        with:
          path: repo_scripts

      - name: Auth to Google Cloud
        if: steps.check_plots.outputs.plots_ok == 'true'
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Install rclone
        if: steps.check_plots.outputs.plots_ok == 'true'
        run: curl https://rclone.org/install.sh | sudo bash

      # Shared with the preview address only; the `email` job shares this same
      # deck with the mailing list once approved.
      - name: Upload Kenya briefing to Drive and share
        if: steps.check_plots.outputs.plots_ok == 'true'
        id: drive
        continue-on-error: true
        run: |
          python -u repo_scripts/publish_briefing_to_drive.py \
            --file "${{ steps.check_plots.outputs.briefing }}" \
            --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho" \
            --live \
            --emails "${{ inputs.preview_email }}"

      - name: Find latest manual analysis deck
        if: steps.check_plots.outputs.plots_ok == 'true'
        id: manual_deck
        continue-on-error: true
        run: |
          python -u repo_scripts/find_latest_manual_analysis.py             --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho"

      - name: Email Kenya briefing preview
        if: steps.check_plots.outputs.plots_ok == 'true'
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "[PREVIEW] Daily S2S Outlook"
          to: ${{ inputs.preview_email }}
          from: "Kenya Data Share <info@dashboards.rhizaresearch.org>"
          body: |
            PREVIEW - only sent to you. Approve the "email" job in
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            to send this to the Kenya mailing list.
            ------------------------------------------------------------
            Today's Kenya S2S briefing is a shared Google Slides deck:
            ${{ steps.drive.outputs.drive_url || '(upload failed)' }}
            Please comment on that deck rather than a local copy.
            Latest expert analysis deck:
            ${{ steps.manual_deck.outputs.deck_url || '(none found)' }}
            You can browse the full plot archive (except station data) at
            https://console.cloud.google.com/storage/browser/africa-forecasting-data .
          reply_to: genevieve@rhizaresearch.org
          attachments: ${{ steps.attachments.outputs.list }}

  # Waits for a required reviewer on the kenya-mailing-list environment, then
  # sends exactly what the preview contained (same artifact, same deck).
  email:
    needs: [build-matrix, preview]
    if: needs.preview.outputs.plots_ok == 'true'
    environment: kenya-mailing-list
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download files as artifact
        uses: actions/download-artifact@v4
        with:
          name: s2s_data_kenya

      - name: Checkout publish script
        uses: actions/checkout@v4
        with:
          path: repo_scripts

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/drive"
          workload_identity_provider: "projects/730596460290/locations/global/workloadIdentityPools/alec-rhiza-github/providers/rhiza-github"
          service_account: "alec-github-action@rhiza-shared.iam.gserviceaccount.com"
          export_environment_variables: true

      - name: Install rclone
        if: needs.preview.outputs.drive_file_id == ''
        run: curl https://rclone.org/install.sh | sudo bash

      # Shares the deck the preview uploaded; uploads fresh only if that failed.
      - name: Share Kenya briefing on Drive
        id: drive
        continue-on-error: true
        run: |
          file_id="${{ needs.preview.outputs.drive_file_id }}"
          if [ -n "$file_id" ]; then
            src=(--existing-id "$file_id")
          else
            src=(--file "${{ needs.preview.outputs.briefing }}" --folder-id "1YE-91Uhx1E8Nx3aSk1CU1SS-B2dD-3ho" --live)
          fi
          python -u repo_scripts/publish_briefing_to_drive.py \
            "${src[@]}" \
            --emails "${{ matrix.emails }}"

      # Hold the email back rather than sending recipients "(upload failed)"
      # in place of the deck link; the step after this turns the run red.
      - name: Email Kenya briefing
        if: needs.preview.outputs.drive_url != '' || steps.drive.outputs.drive_url != ''
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.resend.com
          server_port: 587
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: Daily S2S Outlook
          to: ${{ matrix.emails }}
          from: "Kenya Data Share <info@dashboards.rhizaresearch.org>"
          body: |
            Today's Kenya S2S briefing is a shared Google Slides deck:
            ${{ needs.preview.outputs.drive_url || steps.drive.outputs.drive_url }}
            Please comment on that deck rather than a local copy.
            Latest expert analysis deck:
            ${{ needs.preview.outputs.deck_url || '(none found)' }}
            You can browse the full plot archive (except station data) at
            https://console.cloud.google.com/storage/browser/africa-forecasting-data .
          reply_to: genevieve@rhizaresearch.org
          attachments: ${{ needs.preview.outputs.attachments }}

      - name: Fail if Kenya briefing email was held back
        if: needs.preview.outputs.drive_url == '' && steps.drive.outputs.drive_url == ''
        run: |
          echo "::error::Kenya briefing Drive upload returned no link (step outcome: ${{ steps.drive.outcome }}); the Kenya email was NOT sent. See the 'Share Kenya briefing on Drive' step log."
          exit 1
